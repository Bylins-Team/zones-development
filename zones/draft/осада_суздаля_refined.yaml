  - vnum: 20012
    name: Берег Нерли
    description: 'Каменистый берег реки, где волны лижут прибрежные валуны.

      Вода мутная, красноватая - несёт кровь да тела павших вверх по течению.

      На камнях следы недавнего лагеря - пепел костров, обглоданные кости, тряпьё.

      Меж валунов темнеет расщелина - вход в подводную пещеру, откуда тянет холодом.

      Пахнет речной тиной, водорослями, сладковатым тленом утопленников.

      Слышен плеск воды, шелест камыша, странное пение - то ли ветер, то ли русалки.

      Над водой вьётся туман, даже в полдень не рассеивается.

      '
    examine: 'На прибрежных камнях видны царапины - словно когтями водяной нечисти.

      Меж валунов лежат странные предметы - гребни костяные, ожерелья из ракушек.

      Вода у входа в пещеру особенно тёмная - глубина там бездонная.

      На одном камне высечен знак - трезубец с волнами, древний символ водяного.

      Иногда из глубины доносится смех - девичий, манящий, опасный.

      '
