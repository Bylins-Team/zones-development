  - vnum: 20014
    name: Дворец воеводы Путяты
    description: "Палаты белокаменные с резными колоннами-столпами, что держат своды высокие. \nСтены украшены иконами в окладах\
      \ серебряных, меж ними - портреты предков Путятичей. \nВ центре зала - очаг каменный, в нём тлеют угли, дают скупой\
      \ свет. \nПахнет дубом старым, ладаном, воском свечным. За дубовым столом - воевода Путята \nс дружинниками, склонились\
      \ над картой, голоса глухие, озабоченные. \nСправа - дверь дубовая резная, охраняют два ратника с копьями - покои Забавы.\
      \ \nСлышно, как скрипят половицы под тяжёлыми шагами, потрескивают угли.\n"
    examine: "На стенах - портреты маслом: прадед Вышата с мечом, дед Ян с хоругвью, отец \nв доспехах. Все - с тем же суровым\
      \ взглядом, что у нынешнего воеводы. \nОчаг сложен из камня волжского, привезённого ещё при основании града. \nНа столе\
      \ - карта Суздаля, обведены красным углём места пробоин в стенах. \nКубки оловянные, недопитое вино - кислое, разбавленное.\
      \ У двери в покои Забавы - \nцарапины свежие на косяке, будто когти звериные. Охранники бледны, крестятся.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    id: room_014
    exits:
    - direction: south
      to_room: room_013
      description: Во двор
    - direction: east
      to_room: room_017
      description: К покоям Забавы (охраняется)
    - direction: up
      to_room: room_019
      description: На лестницу в башню
  - vnum: 20015
    name: Лазарет
    description: "Каменная палата, что прежде была складом зерновым, ныне - пристанище страждущих. \nНа соломе гнилой лежат\
      \ раненые рядами, стонут, бредят, молятся. \nЛекари в окровавленных рубахах режут плоть, прижигают раны каленым железом.\
      \ \nВоздух тяжёл, удушлив: кровь, гной, испражнения, дым от жаровен. \nПахнет смертью - сладковатый, тошный смрад. Слышны\
      \ крики под ножом лекарским, \nхрип умирающих, молитвы священника над телами. У стены - штабель трупов в саванах, \n\
      ждут погребения. Мухи роем вьются, жужжат зловеще.\n"
    examine: "Лекари работают без сна - руки дрожат, глаза воспалённые. Один режет стрелу \nиз плеча ратника, другой прижигает\
      \ культю - рука отсечена начисто. \nРаненые лежат вповалку: кто с пробитым боком, кто с раздробленной ногой, \nкто с\
      \ ожогами от смолы кипучей. Монах читает отходную над умирающим - \nхрипит, кровь пузырится на губах. В углу - бочка\
      \ с водой мутной, ковш плавает. \nНа полках - склянки с зельями, бинты грязные, пилы да ножи лекарские. \nПол скользкий\
      \ от крови, солома слежалась в бурые комья.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    id: room_015
    exits:
    - direction: west
      to_room: room_013
      description: Во двор
    - direction: north
      to_room: room_018
      description: К храму Покрова
  - vnum: 20016
    name: Казармы дружинников
    description: 'Длинное каменное здание с низким сводом, прорезанное узкими окнами-бойницами.

      Вдоль стен тянутся дубовые нары, застланные овчинами и потёртыми кожухами.

      На нарах дремлют уставшие ратники - кто в кольчуге не снятой, кто с перевязанной

      головой. Пахнет потом, кожей, железом, кровью запёкшейся. У очага трое точат

      мечи - визг точила режет уши. На стенах развешаны щиты круглые с вмятинами,

      копья с обломанными древками, кольчуги порванные. Пол утоптан, забрызган кровью

      бурой. Слышны храп, стоны во сне, бормотание молитв. В углу дружинник чинит

      ремень щита, ругается вполголоса.'
    examine: 'На нарах у дальней стены лежит молодой ратник - лицо бледное, повязка на груди

      красная от крови. Бредит: "Забаву... не отдадим... ворота держим...". Рядом

      сидит седой дружинник, чинит кольчугу - пальцы дрожат, глаза красные. На стене

      над очагом нацарапано углём: "Восьмой день. Стрел мало. Смолы нет. Бог с нами."

      У порога валяется обломок булгарской стрелы - оперение чёрное, наконечник

      кривой. Трофей или напоминание о смерти близкой.

      '
    sector: INSIDE
    flags:
    - INDOORS
    id: room_016
    exits:
    - direction: east
      to_room: room_013
      description: Во двор
    - direction: north
      to_room: room_034
      description: К тренировочному двору
  - vnum: 20017
    name: Покои Забавы Путятичны
    description: 'Светлая горница в высоком тереме, стены резные - птицы да цветы в дубе вырезаны.

      Окна узкие, слюдяные, пропускают свет молочный. На полу ковры узорчатые -

      красные, синие, золотые. Вдоль стены лавка с подушками шитыми, сундук окованный.

      В красном углу - икона Покрова Богородицы, перед ней свеча теплится, отблески

      по ликам святых скользят. На столе дубовом - гребень костяной (резьба тонкая,

      птицы-павы), зеркало медное, книги в кожаных переплётах. Пахнет благовониями -

      ладан, мирра, травы сушёные. Слышны шаги тяжёлые за дверью - охрана. Сквозь

      окно доносится колокольный звон, крики с валов.'
    examine: 'На столе раскрыта книга - Псалтирь, страница измята, будто читали и плакали.

      Рядом лежит гребень костяной - древний, потемневший, с вырезанными рунами на

      обухе. Это амулет родовой Путятичей - бабка-ведунья завещала. Если приглядеться,

      руны светятся еле-еле, как угли под пеплом. На подоконнике - увядший венок из

      полевых цветов, принесённый Алёшей на Красную горку. Под подушкой на лавке

      виден край письма - почерк чужой, вязь непонятная. Булгарская? В углу у двери -

      посох дорожный и сапожки, будто готовилась в путь, да передумала.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    id: room_017
    exits:
    - direction: west
      to_room: room_014
      description: Назад во дворец
    - direction: up
      to_room: room_020
      description: На лестницу в башню (охраняется)
  - vnum: 20018
    name: Собор Покрова Богородицы
    description: 'Величественный храм белокаменный, своды высокие уходят в полумрак под куполом

      золотым. Иконостас резной сияет в свете свечей - лики святых строгие, глаза

      всевидящие. Пол - мозаика каменная, узоры древние, истёртые стопами молящихся.

      Пахнет ладаном густым, воском церковным, камнем холодным. В центре, перед

      алтарём - неугасимая свеча в подсвечнике золотом, высотой с человека. Пламя

      ровное, но слабое - фитиль на исходе, воск тает. Слышны молитвы тихие, всхлипы,

      шёпот. У стен - люди на коленях: жёны дружинников, старики, дети.'
    examine: 'Неугасимая свеча - сердце Суздаля. Волхв Велимудр зажёг её при основании града,

      наговорил: "Пока горит - град стоять будет". Воск особый - пчелиный, с медвяной

      росой, что только в заповедном бору растёт. Сейчас свеча догорает - осталось

      на три дня, не больше. Фитиль дрожит, будто живой. Подсвечник покрыт рунами -

      не христианскими, древними, ещё до крещения. У подножия - приношения: хлеб,

      мёд, цветы, слёзы материнские. На полу перед свечой - круг выжженный, будто

      молния ударила когда-то. В углу за иконостасом - дверь узкая, почти незаметная.

      Ведёт вниз, в келью волхва. Оттуда тянет холодом могильным и тайной.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    - NO_MAGIC
    id: room_018
    exits:
    - direction: south
      to_room: room_015
      description: К лазарету
    - direction: down
      to_room: room_041
      description: В келью волхва Велимудра (секретный ход)
  - vnum: 20019
    name: Винтовая лестница в башню Забавы
    description: "Узкая каменная лестница вьётся вверх крутой спиралью, стены холодные и влажные от речного тумана. \nНа белом\
      \ камне видны странные царапины - словно когти нечеловеческие скребли по известняку. \nПахнет сыростью, мхом и чем-то\
      \ едва уловимым - ладаном с примесью полыни. \nСквозь узкие бойницы врывается гул осады: барабанный бой, крики, лязг\
      \ железа. \nНаверху слышны тяжёлые шаги охранников, внизу - приглушённые голоса из дворца. \nФакелы в кованых держателях\
      \ коптят, отбрасывая пляшущие тени на ступени.\n"
    examine: "Ступени истёрты до блеска поколениями ног - здесь ходили ещё деды воеводы Путяты. \nЦарапины на стенах свежие,\
      \ глубокие - три борозды параллельные, как от звериных когтей. \nВ одной из щелей меж камней блестит чешуйка змеиная\
      \ - зеленоватая, с металлическим отливом. \nЗапах полыни усиливается к верху - то ли Забава курит травы вещие, то ли\
      \ мамка Василиса обереги ставит. \nНа подоконнике бойницы лежит забытая стрела булгарская - древко обожжено, наконечник\
      \ с зазубринами.\n"
    sector: INSIDE
    flags:
    - INDOORS
    id: room_019
    exits:
    - direction: down
      to_room: room_014
      description: Вниз во дворец
    - direction: up
      to_room: room_020
      description: Вверх на первый уровень башни
  - vnum: 20020
    name: Первый ярус башни Забавы
    description: "Круглая комната с низким сводчатым потолком, стены выбелены известью. \nЧетыре бойницы смотрят на все стороны\
      \ света - в восточную видно чёрное море булгарских шатров. \nНа полу ковёр шерстяной с узором птиц райских, в углу дубовый\
      \ сундук окованный. \nПахнет воском свечным, сухими травами из связок под потолком, слабо - женскими благовониями сверху.\
      \ \nСлышны голоса дружинников на лестнице, их топот, звон оружия. \nУ западной стены дверь резная ведёт в покои княжны,\
      \ над ней икона Покрова в окладе серебряном.\n"
    examine: "Сундук не заперт - внутри женские уборы: платки шёлковые, пояса шитые, гребни костяные. \nНа дне лежит детская\
      \ игрушка - тряпичная кукла в сарафане, выцветшая, затёртая. \nКовёр старинный, ещё бабки Забавы работы - птицы на нём\
      \ не простые, а Сирин да Алконост. \nВ бойницах видны следы недавнего боя - сколы от камней, застрявшая стрела. \nТравы\
      \ под потолком - полынь, зверобой, чертополох - от нечисти оберег. \nИкона Покрова потемнела от времени, но лик Богородицы\
      \ светится в полумраке.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    id: room_020
    exits:
    - direction: down
      to_room: room_019
      description: Вниз по лестнице
    - direction: up
      to_room: room_021
      description: Вверх на второй уровень
    - direction: west
      to_room: room_017
      description: В покои Забавы
  - vnum: 20021
    name: Второй ярус башни Забавы
    description: "Комната ещё теснее, потолок так низок, что высокий мужчина заденет головой. \nОкна-бойницы шире здесь, завешаны\
      \ тканью узорчатой - сквозь неё просачивается красный свет заката. \nНа полу подушки шитые, покрывала, разбросаны будто\
      \ в спешке. \nУ восточного окна столик резной - на нём книги в кожаных переплётах, свечи оплывшие, гребень из моржовой\
      \ кости. \nПахнет ладаном, розовым маслом, воском, чем-то горьковатым - полынным настоем. \nСлышны голоса женские -\
      \ Забавы звонкий и мамки Василисы хриплый, шёпот молитвенный. \nСтены расписаны - птицы, цветы, звёзды - работа искусная,\
      \ но незаконченная.\n"
    examine: "Книги на столе - Псалтирь, Часослов, но есть и странная - без названия, с рунами на обложке. \nГребень костяной\
      \ покрыт резьбой - звери, птицы, знаки непонятные. \nЭто тот самый гребень родовой, что от бабки-ведуньи достался Забаве.\
      \ \nНа подушках волосы золотые - длинные, тонкие, пахнут травами. \nРоспись на стенах недавняя - краски ещё не высохли\
      \ до конца. \nЗабава рисовала сны свои вещие - вот мост меж мирами, вот лебедь белая и ворон чёрный. \nВ углу стоит\
      \ кувшин с водой - вода странная, мерцает в полумраке серебристо.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    - NO_MAGIC
    id: room_021
    exits:
    - direction: down
      to_room: room_020
      description: Вниз
    - direction: up
      to_room: room_022
      description: Вверх на третий уровень
  - vnum: 20022
    name: Покои Забавы Путятичны
    description: 'Высокая светлица в башне, где воздух пропитан ладаном и горечью полыни.

      Узкие окна-бойницы выходят на все четыре стороны - на восток видны чёрные

      шатры булгар, на запад - купол собора Покрова. Пол устлан шерстяными коврами

      с узорами птиц и древ, стены завешаны тканями шёлковыми - дар от киевских

      купцов. У восточной стены - ложе резное с подушками, шитыми золотом. На столе

      дубовом - зеркало медное, гребень костяной, свитки с молитвами. В красном

      углу - икона Покрова Богородицы, пред нею теплится лампада. Пахнет воском,

      розовым маслом, слезами.'
    examine: 'На гребне костяном вырезаны руны древние - память рода Путятичей. Зеркало

      потускнело от слёз. На подушках - примятость от бессонных ночей. Под иконой -

      записка, свёрнутая трубкой: "Матерь Божья, укажи путь - гореть ли граду али

      мне в полон идти?" Пол у восточного окна истоптан - здесь Забава стоит часами,

      глядя на стан врага. В воздухе - странное напряжение, будто само место ждёт

      решения судьбоносного.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    id: room_022
    exits:
    - direction: down
      to_room: room_021
      description: Вниз
    - direction: up
      to_room: room_023
      description: На крышу башни
  - vnum: 20023
    name: Вершина башни Забавы
    description: 'Плоская крыша башни, огороженная парапетом белокаменным по пояс высотой.

      Отсюда виден весь Суздаль - кремль с собором златоглавым, посад с чёрными

      пожарищами, валы земляные, ощетинившиеся кольями. За стенами - море булгарских

      шатров от леса до речной излуки, дымы костров застят полнеба. На крыше -

      древко с флагом суздальским, истрёпанным ветрами осады. У парапета - колокол

      медный на деревянной раме, в него бьют при тревоге. Ветер несёт запахи гари,

      крови, степных трав. Слышны барабаны булгарские - глухие, мерные, как биение

      сердца земли. Вдали - колокольный звон соборный, дрожащий и призывный.'
    examine: 'Камни парапета исписаны молитвами - кто-то царапал их ножом в отчаянии.

      Флаг изорван стрелами - булгары стреляли сюда из луков дальнобойных. Колокол

      покрыт патиной зелёной, но звук его чист и звонок. С этой высоты видно то,

      что скрыто от защитников на валах: булгары готовят большой таран, обтянутый

      кожами мокрыми, и три осадные башни подкатывают к стенам. В булгарском стане

      горит огонь особенный - не костровой, а ритуальный, вокруг него пляшут шаманы.

      Место это - средоточие судьбы града. Здесь решения принимаются, здесь вещие

      сны приходят. Воздух дрожит от невидимых сил.

      '
    sector: INSIDE
    flags:
    - INDOORS
    id: room_023
    exits:
    - direction: down
      to_room: room_022
      description: Вниз в комнату
    - direction: east
      to_room: room_043
      description: Магический переход (вещий сон)
  - vnum: 20024
    name: Подземный ход под кремлём
    description: 'Длинный коридор, прорытый в земле и камне, своды поддерживаются брёвнами

      дубовыми, почерневшими от времени. Стены сочатся влагой, покрыты мхом

      скользким и плесенью зеленоватой. Пол - утоптанная глина, местами лужи

      стоячей воды. Воздух спёртый, пахнет сыростью, землёй, чем-то древним и

      забытым. Слышны звуки странные - капли падают мерно, где-то журчит вода,

      эхо разносит шорохи непонятные. Факелы на стенах горят тускло, коптят,

      отбрасывают тени пляшущие. Развилки ведут в разные стороны - на север к

      центральному хранилищу, на юг к реке, на восток к башне, на запад к

      западному входу.'
    examine: 'Ход прорыт ещё при основании града - об этом говорят руны на сводах, стёртые

      временем. Брёвна-подпорки изъедены древоточцем, но держат крепко. На стенах -

      следы когтей, будто кто-то царапал камень в отчаянии. В лужах - отражения

      факелов дрожат, создавая иллюзию движения. Воздух здесь особенный - не просто

      спёртый, а наполненный присутствием чего-то иного. Старики говорили, что ход

      ведёт к пещере русалок под Нерлью-рекой, что духи водяные стерегут его. Слышны

      голоса - то ли эхо, то ли шёпот мёртвых, что полегли при строительстве. Место

      силы и опасности.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    id: room_024
    exits:
    - direction: north
      to_room: room_025
      description: К центральному хранилищу
    - direction: south
      to_room: room_005
      description: К реке (подводный ход)
    - direction: east
      to_room: room_026
      description: К восточной башне
    - direction: west
      to_room: room_029
      description: К западному входу
  - vnum: 20025
    name: Подземное хранилище
    description: "Сводчатая палата в недрах кремля, где громоздятся припасы осаждённого града.\nВдоль стен тянутся дубовые\
      \ полки, прогнувшиеся под тяжестью мешков с зерном — \nрожь, овёс, греча. В углах высятся бочки с солониной, кадки с\
      \ квашеной капустой,\nглиняные корчаги с мёдом. Пахнет зерновой пылью, сыростью земляной, кислой капустой.\nС потолка\
      \ капает вода — кап, кап, кап — в лужицы на каменном полу. Слышен шорох —\nкрысы снуют меж мешков, грызут холстину.\
      \ У дальней стены лежат связки сушёных трав,\nлуковицы, вязанки чеснока. Коптилка на железной цепи даёт скупой свет,\
      \ отбрасывая\nтени на своды."
    examine: 'Приглядевшись, замечаешь: мешки с мукой надорваны — кто-то брал втихую, не по счёту.

      На полу мучные следы ведут к западному ходу. На одной бочке выцарапано: «Осьмой день.

      Хлеба на три недели. Коли не подмога — быть голоду». Почерк дрожащий, словно писал

      человек измученный. В углу валяется деревянная ложка, обглоданная крысами. Под полками

      виднеются кости — крысиные черепа, рёбра. Кто-то ставил здесь ловушки. На своде потолка

      странные знаки — не то крест, не то руна древняя. Волхв Велимудр освящал хранилище?

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    id: room_025
    exits:
    - direction: south
      to_room: room_024
      description: К главному коридору
    - direction: east
      to_room: room_026
      description: К восточной башне
    - direction: west
      to_room: room_029
      description: К западному входу
    - direction: down
      to_room: room_030
      description: Глубже в подземелье (к сокровищнице)
  - vnum: 20026
    name: Подземелье восточной башни
    description: 'Каменная палата под башней, где пахнет железом, кровью и страхом. Вдоль стен громоздятся

      ящики с оружием — мечи, копья, секиры, кольчуги на деревянных болванах. На полу валяются

      щиты с выбоинами от булгарских стрел, шлемы с вмятинами, обрывки кожаных доспехов.

      У дальней стены — точильный круг, рядом кадка с водой для закалки клинков. Пахнет

      ржавчиной, машинным маслом, потом ратным. Слышен звук капели — где-то течёт вода,

      стекает по стенам. На каменном полу тёмные пятна — не то кровь, не то ржавчина.

      Факел на стене коптит, отбрасывая дрожащие тени.'
    examine: 'Приглядевшись к оружию, видишь: многие клинки зазубрены, иные надломлены. Кольчуги

      порваны — кольца выбиты, латы помяты. Это не парадное оружие, а то, что собрали

      с павших, починили наскоро. На одном щите выжжено: «Ратибор». Хромой дружинник?

      У точильного круга лежит окровавленная тряпица — кто-то недавно точил меч, порезался.

      На стене нацарапано углём: «Алёша держит врата. Мы держим башню. Не падём». Почерк

      твёрдый, уверенный. Под лестницей виднеется узкая щель — ход куда-то вбок, но завален

      камнями. Оттуда тянет могильным холодом.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    id: room_026
    exits:
    - direction: up
      to_room: room_008
      description: Вверх в восточную башню
    - direction: west
      to_room: room_025
      description: К хранилищу
    - direction: south
      to_room: room_027
      description: К юго-восточному углу
  - vnum: 20027
    name: Подземелье юго-восточного угла
    description: 'Сырая каменная палата в углу крепостных подземелий, где царит тревожная тишина.

      Стены покрыты странными царапинами — длинные борозды, словно когти зверя или нечисти

      скребли камень. Пахнет затхлостью, плесенью, чем-то сладковато-тошным — гниль? Магия?

      На полу начертаны мелом круги и руны — кто-то проводил обряд, но круги стёрты, будто

      кто-то прошёл сквозь них. Слышны странные звуки — то ли шёпот, то ли шорох крыльев,

      то ли скрежет зубов.'
    examine: 'Приглядевшись к царапинам, различаешь: это не звериные когти — слишком ровные,

      словно нарочно выцарапаны. Между бороздами виднеются символы — змея, глаз, полумесяц.

      Булгарская магия? Тугарин Змеевич здесь бывал? На полу среди рун лежит чешуйка —

      зеленоватая, переливчатая, как змеиная кожа. Пахнет от неё серой и гнилью. Рядом

      обрывок ткани — шёлк булгарский, красный с золотом. Кто-то из врагов проник сюда?

      На стене нацарапано по-русски, дрожащей рукой: «Видел змея. Говорил голосом Ратибора.

      Не верьте Хромому». Подпись стёрта. Под лестницей виднеется узкая щель — оттуда

      тянет могильным холодом и слышен далёкий шёпот на чужом языке.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    id: room_027
    exits:
    - direction: up
      to_room: room_009
      description: Вверх на стену
    - direction: west
      to_room: room_025
      description: К хранилищу
    - direction: north
      to_room: room_026
      description: К восточной башне
  - vnum: 20028
    name: Подземелье южной стены
    description: 'Сводчатая камера под южной стеной кремля, где белый камень почернел от сырости.

      Стены покрыты изумрудным мхом и бурыми водорослями - река близко, просачивается

      сквозь кладку. С потолка падают тяжёлые капли, звонко бьют по лужам на каменном

      полу. Пахнет речной водой, тиной, прелой землёй. Слышны странные звуки - то ли

      журчание подземного ручья, то ли далёкое пение... женские голоса, манящие,

      печальные. Холод здесь костяной, влажный - пробирает до мозга костей. На восток

      ведёт коридор к хранилищу, на юг - к главному подземному ходу, вверх - каменные

      ступени к южной стене.

      '
    examine: 'Присмотревшись к стенам, различаешь под мхом древние резные знаки - обереги от

      нечисти водяной. Волхв Велимудр освящал эти подземелья, когда град закладывали.

      В углу лежит истлевший рыбачий невод - кто-то пытался ловить рыбу прямо здесь,

      где вода сочится из щелей. На полу - след босой ноги, слишком узкой, слишком

      длинной для человека. Русалки подбираются к граду через подземные воды... Пение

      то усиливается, то затихает - зовут кого-то, манят в глубины Нерли-реки.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    id: room_028
    exits:
    - direction: up
      to_room: room_010
      description: Вверх на стену
    - direction: west
      to_room: room_025
      description: К хранилищу
    - direction: south
      to_room: room_024
      description: К главному коридору
  - vnum: 20029
    name: Подземелье западной стены
    description: 'Низкий каменный свод, почерневший от факельной копоти и крови. Здесь хранят

      запасное оружие для защитников западной стены - той, что принимает главный удар

      булгарских таранов. Вдоль стен громоздятся связки стрел, копья в пирамидах,

      щиты с выбоинами. Пол усеян щепками древков, обломками мечей, окровавленными

      тряпками. Пахнет железом, застарелой кровью, потом ратников. Сверху доносятся

      глухие удары - таран бьёт в ворота, стены дрожат, каменная пыль сыплется с

      потолка. Слышны приглушённые крики, лязг оружия, стоны раненых.'
    examine: 'На стене мелом нацарапаны имена павших защитников - дружинники пишут здесь

      поминальные списки, когда некогда хоронить по-христиански. Счёт идёт на сотни.

      В углу стоит бочка с кипящей смолой - её поднимут наверх, когда булгары пойдут

      на штурм. Рядом - связка факелов, кремни, трут. На полу - детский башмачок,

      истоптанный, с оторванной подошвой. Чей-то ребёнок прибежал сюда в панике, когда

      посад горел... Под ногами хрустит что-то - осколки амулетов-оберегов, что

      дружинники носят на шеях. Многие разбились вместе с хозяевами.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    id: room_029
    exits:
    - direction: up
      to_room: room_011
      description: Вверх на стену
    - direction: east
      to_room: room_025
      description: К хранилищу
    - direction: south
      to_room: room_024
      description: К главному коридору
  - vnum: 20030
    name: Сокровищница Суздаля
    description: 'Глубокая подземная палата, вырубленная в скале под самым основанием кремля.

      Своды теряются во тьме, стены испещрены древними рунами - обереги волхва

      Велимудра, что стерегут богатства града. Вдоль стен - дубовые сундуки, окованные

      железом, полные серебряных гривен и золотых византийских монет. На полках -

      драгоценная утварь: кубки, оклады икон, княжеские венцы. В центре - каменный

      алтарь, а на нём - легендарное оружие: меч-кладенец в ножнах из змеиной кожи,

      копьё с наконечником из метеоритного железа, щит с ликом Георгия Победоносца.'
    examine: 'Руны на стенах пульсируют слабым серебристым сиянием - защитные чары живы и

      поныне. Прочесть их может лишь волхв, но чувствуется: здесь нельзя проливать

      кровь, нельзя лгать, нельзя красть. Нарушивший клятву падёт мёртвым. На алтаре

      лежит свиток из телячьей кожи - завещание князя Владимира Красно Солнышко, где

      сказано: «Сим оружием биться лишь за Русь, не ради корысти». Меч-кладенец

      выкован из осколка небесного камня, что упал в Нерль-реку при крещении Руси.

      Копьё принадлежало Илье Муромцу - он оставил его здесь, когда постригся в монахи.

      Щит - дар византийского императора воеводе Путяте за победу над печенегами.

      Восточный проход ведёт... куда? Оттуда веет водой, слышится русалочье пение.

      Магический переход в иной мир - к святилищу русалок под Нерлью-рекой.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    id: room_030
    exits:
    - direction: up
      to_room: room_025
      description: Вверх к хранилищу
    - direction: east
      to_room: room_042
      description: Магический переход (к святилищу русалок)
  - vnum: 20031
    name: Боевая платформа восточного вала
    description: "Дубовый настил скрипит под ногами ратников, доски потемнели от крови и копоти. \nВдоль бруствера громоздятся\
      \ плетёные щиты, утыканные стрелами булгарскими - \nдревки торчат ощетинившимся частоколом. Котлы со смолой дымятся\
      \ над кострами, \nедкий чад ест глаза. Лучники хватают стрелы из кож, натягивают тетивы - свист, \nзвон, глухой удар\
      \ в щиты врага. Копейщики жмутся к бойницам, выставив пики меж \nзубцов. Пахнет потом, железом, горячей кровью на досках.\
      \ С поля несёт гарь \nпожарищ, слышен барабанный бой булгар - мерный, давящий, как биение чёрного \nсердца."
    examine: "Платформа держится на толстых дубовых сваях, вбитых в земляной вал. Доски \nнастила изрублены, в щелях запеклась\
      \ кровь - чья, не разобрать. У бруствера \nпримёрзла к доскам чья-то шапка, пробитая стрелой насквозь. В котле со смолой\
      \ \nплавает мёртвая ворона - видать, упала с неба. Один из щитов расписан красной \nкраской: \"Стоять до смерти\". На\
      \ перилах вырезаны зарубки - кто-то считает дни \nосады. Восьмая зарубка глубже прочих, свежая. Меж досок проглядывает\
      \ земля вала - \nутоптанная, смешанная с золой. Слышно, как внизу скрипят ворота под ударами \nтарана - мерно, страшно,\
      \ неотвратимо.\n"
    sector: INSIDE
    flags:
    - INDOORS
    id: room_031
    exits:
    - direction: down
      to_room: room_007
      description: Вниз на вал
    - direction: west
      to_room: room_033
      description: К западной платформе
  - vnum: 20032
    name: Вершина восточной башни
    description: "Ветер хлещет по плоской крыше башни, рвёт полотнище стяга - красный лев на белом \nполе, герб воеводы Путяты.\
      \ Древко скрипит, железный наконечник звенит. Деревянный \nпарапет изрешечён стрелами - торчат пучками, как перья дикобраза.\
      \ За парапетом - \nбоевые позиции лучников: кожи со стрелами, запасные луки, щиты на подпорках. \nМедный колокол висит\
      \ на перекладине, язык его обмотан тряпьём - чтоб не звонил \nбез нужды. Пахнет высотой, ветром с реки, дымом пожарищ.\
      \ Под ногами доски гулкие, \nпрогибаются - страшно смотреть вниз сквозь щели."
    examine: "Крыша башни - квадратная площадка, сажени три на три. Доски толстые, дубовые, но \nпрогнили по краям - видны\
      \ дыры, заткнутые тряпьём. Парапет по пояс высотой, \nбойницы прорезаны крестом - для стрельбы. На досках мелом нацарапаны\
      \ слова: \n\"Господи, помилуй\". Колокол старый, на боку литьё стёрлось, но видна дата - \n\"Лето 6600\" (1092 год).\
      \ Язык обмотан холстом - развяжешь, зазвонит на весь град. \nСтяг порван в трёх местах, но держится - древко крепкое,\
      \ ясеневое. У северного \nкрая крыши лежит мёртвый лучник, стрела в глазу - застыл, глядит в небо. Никто \nне убрал\
      \ - некогда. Вороны кружат над башней, каркают жадно. С высоты видно: \nв булгарском стане зажигают факелы - готовятся\
      \ к ночному штурму.\n"
    sector: INSIDE
    flags:
    - INDOORS
    id: room_032
    exits:
    - direction: down
      to_room: room_008
      description: Вниз в башню
  - vnum: 20033
    name: Боевая платформа западного вала
    description: "Здесь бьётся сердце обороны Суздаля - платформа, где Алёша Попович держит главный \nудар. Доски под ногами\
      \ дрожат от топота, скользкие от крови - свежей, ещё тёплой. \nАлёша стоит у бруствера, лук в руке, колчан на поясе\
      \ - стреляет, не целясь, \nкаждая стрела находит врага. Вокруг него дружина - тридцать молодцов, лица \nзакопчённые,\
      \ глаза красные от дыма. Кричат \"Ура!\", бьют мечами в щиты - гремит, \nкак гром. Котлы со смолой кипят на кострах,\
      \ пар валит - двое дружинников черпают \nковшами, льют на головы штурмующих. Слышны вопли внизу - смола жжёт, плавит\
      \ кожу."
    examine: "Платформа шире прочих - сажени четыре в длину, настлана тройными досками. Здесь \nне просто оборона - здесь\
      \ Алёша творит чудеса. На бруствере вырезано: \"Место \nПоповича\". Щиты громоздятся стеной - плетёные, дубовые, железные,\
      \ все в стрелах. \nЗа щитами - кучи оружия: мечи, копья, топоры, булавы - хватай что хочешь. Котлы \nсо смолой - три\
      \ штуки, огромные, на треножниках. Смола кипит, пузырится, пар \nвалит - обжигает лицо даже издали. Рядом лежат мешки\
      \ с песком - тушить пожары. \nНа досках кровь смешалась с золой, смолой - чёрная жижа, липкая. Алёша Попович - \nмолодой,\
      \ лет двадцати пяти, русый, глаза серые, лицо в копоти. Кольчуга на нём \nблестит, шлем с наносником, меч на поясе.\
      \ Стреляет быстро - три стрелы за раз, \nвсе в цель. Дружинники глядят на него как на бога. Один шепчет: \"С ним не\
      \ падём\".\n"
    sector: INSIDE
    flags:
    - INDOORS
    id: room_033
    exits:
    - direction: down
      to_room: room_011
      description: Вниз на вал
    - direction: east
      to_room: room_031
      description: К восточной платформе
  - vnum: 20034
    name: Тренировочный двор
    description: "Утоптанная земля двора изрыта следами сапог, темна от пролитой крови.\nВдоль стен громоздятся чучела-манекены,\
      \ набитые соломой и тряпьём - \nиссечённые мечами, истыканные копьями. Деревянные столбы для рубки \nпокрыты зарубками,\
      \ щепа валяется под ногами. На железных крюках висят \nтренировочные мечи, топоры, булавы - затупленные, но тяжёлые.\
      \ Пахнет \nпотом, кровью, древесной пылью. Слышны удары клинков о столбы, хриплые \nвыдохи ратников, окрики наставников.\
      \ Молодые дружинники мечутся меж \nмишеней - лица красны, рубахи мокры."
    examine: "На восточной стене кто-то нацарапал ножом счёт дней осады - восемь \nзарубок. Под ними приписано корявыми буквами:\
      \ \"Господи, спаси\". \nУ северного столба валяется сломанный меч - клинок треснул пополам \nот удара. Рядом темнеет\
      \ пятно крови - видать, кто-то тренировался \nслишком яростно. В углу двора сложены запасные древки для копий - \nясень\
      \ белый, ещё не ошкуренный. Пахнет свежим деревом среди вони \nпота и железа - словно глоток чистого воздуха в аду.\n"
    sector: INSIDE
    flags:
    - INDOORS
    id: room_034
    exits:
    - direction: south
      to_room: room_016
      description: К казармам
    - direction: east
      to_room: room_035
      description: К стрелковому полю
  - vnum: 20035
    name: Стрелковое поле
    description: "Узкая полоса земли вдоль южной стены, уставленная мишенями - щиты \nдырявые, доски с нарисованными кругами,\
      \ чучела в булгарских халатах.\nЗемля утыкана обломками стрел - древки торчат, как щетина. Вдоль \nзападной стены тянется\
      \ навес, под которым лучники пригибаются, \nнатягивают тетивы. Слышен свист стрел, глухие удары в мишени, \nскрип луков.\
      \ Пахнет воском тетив, смолой оперения, пылью. Молодой \nстрелок промахивается - стрела втыкается в землю, он матерится\
      \ \nсквозь зубы. Старый лучник с седой бородой поправляет хват новичка, \nбормочет: \"Дыши ровно, сынок, не дёргай\"\
      ."
    examine: "На ближайшей мишени - щите дырявом - видна надпись углём: \"Аюп\". \nЩит весь истыкан стрелами - лучники целятся\
      \ в имя врага, словно \nзаговор творят. У восточного края поля лежит колчан, полный стрел \nс чёрным оперением - воронье\
      \ перо. Это стрелы особые, для дальнего \nбоя - летят дальше обычных, но дороги. Рядом валяется сломанный лук - \nтетива\
      \ лопнула, хлестнула стрелка по лицу. На земле темнеет капля \nкрови. В углу под навесом стоит бочка с водой - лучники\
      \ мочат руки, \nчтоб мозоли не натирали. Вода мутная, с примесью крови.\n"
    sector: INSIDE
    flags:
    - INDOORS
    id: room_035
    exits:
    - direction: west
      to_room: room_034
      description: К тренировочному двору
  - vnum: 20036
    name: Шатёр князя Аюпа
    description: "Огромный шатёр из чёрного войлока, крыша коего увенчана красным \nзнаменем - полумесяц золотой и волк серебряный.\
      \ Внутри простор \nнеимоверный - пол устлан коврами узорчатыми, стены завешаны \nшкурами медвежьими да волчьими. В центре\
      \ - низкий стол, уставленный \nяствами: баранина жареная, лепёшки, кумыс в кожаных бурдюках. \nПахнет благовониями восточными\
      \ - сандал, мирра, - кожей, дымом \nкурильниц. На стенах висят сабли кривые, луки составные, щиты \nкруглые с чеканкой.\
      \ В углу громоздится сундук окованный - видать, \nказна походная."
    examine: "На столе среди яств лежит амулет костяной - волчий клык на ремешке, \nпокрытый рунами. Пахнет от него чем-то\
      \ древним, звериным. Это оберег \nшаманский - защищает от стрел, от порчи. Рядом стоит чаша серебряная \nс тёмной жидкостью\
      \ - не вино, не кумыс. Пахнет травами горькими, \nполынью. Зелье для вещих снов - Аюп пьёт его по ночам, видит Забаву.\n\
      На картах Суздаля нацарапаны пометки - красным углём обведена башня \nвысокая. Там покои Забавы. Под картой лежит лоскут\
      \ ткани - золотая \nнить, видать, от её платья. Аюп хранит как святыню. В углу у сундука \nваляется окровавленная тряпка\
      \ - кто-то из батыров ранен, перевязывался.\n"
    sector: FIELD
    flags: []
    id: room_036
    exits:
    - direction: east
      to_room: room_001
      description: На поле боя
    - direction: north
      to_room: room_037
      description: К лагерю
    - direction: south
      to_room: room_038
      description: К ставке Тугарина
  - vnum: 20037
    name: Булгарский лагерь
    description: "Чёрные шатры растянулись до горизонта, меж ними дымятся костры. Красные \nзнамёна с полумесяцем и волком\
      \ хлопают на ветру. Воины в кольчугах точат \nмечи, варят похлёбку в котлах, дремлют на кошмах. Пахнет дымом, варёной\
      \ \nбараниной, конским потом. Слышны гортанные голоса, лязг оружия, мерный \nбарабанный бой. К западу виден большой\
      \ шатёр князя Аюпа, к востоку громоздятся \nосадные машины. Земля истоптана тысячами ног, изрыта кострищами.\n"
    examine: "Лагерь раскинут с военной сноровкой - шатры рядами, меж ними проходы для \nконницы. У каждого костра сидят десятки\
      \ воинов - одни чинят доспехи, другие \nиграют в кости, третьи молятся, склонившись к востоку. На кольях сушатся \n\
      кожи, окровавленные тряпки. Воронье кружит над лагерем, выжидая поживы. \nЧувствуется напряжение перед решающим штурмом\
      \ - воины говорят вполголоса, \nчасто поглядывают на белые стены Суздаля.\n"
    sector: FIELD
    flags:
    - NOWEATHER
    id: room_037
    exits:
    - direction: south
      to_room: room_002
      description: К краю лагеря
    - direction: west
      to_room: room_036
      description: К шатру Аюпа
    - direction: east
      to_room: room_039
      description: К осадным машинам
    - direction: north
      to_room: room_040
      description: К конюшне
  - vnum: 20038
    name: Ставка Тугарина Змеевича
    description: "Чёрный шатёр, обтянутый змеиными кожами, стоит поодаль от прочих. На входе \nначертаны кровавые руны, отпугивающие\
      \ непосвящённых. Внутри полумрак - \nкоптят масляные светильники, отбрасывая пляшущие тени. На алтаре из черепов \n\
      лежат кости, амулеты, засохшие травы. Стены расписаны змеями - кажется, они \nшевелятся в свете огня. Пахнет кровью,\
      \ полынью, чем-то сладковато-тошным. \nСлышны странные шорохи, будто чешуя скребётся о землю. Здесь витает злая магия.\n"
    examine: "Присмотревшись, видишь: на алтаре лежит живая гадюка, свернувшаяся кольцом \nвокруг человеческого черепа. Её\
      \ глаза горят красным. На полу начерчен круг \nиз пепла - внутри него кровавые следы, будто кто-то превращался из человека\
      \ \nв змею. У дальней стены висит карта Суздаля, исколотая ножами - помечены \nслабые места обороны. Пахнет предательством\
      \ и колдовством. Воздух давит на \nгрудь, дышать тяжело.\n"
    sector: FIELD
    flags:
    - DARKED
    - NO_MAGIC
    id: room_038
    exits:
    - direction: north
      to_room: room_036
      description: К шатру Аюпа
    - direction: east
      to_room: room_039
      description: К осадным машинам
  - vnum: 20039
    name: Осадные машины
    description: "Громады деревянные громоздятся под открытым небом - тараны-«бараны» с \nжелезными головами, осадные башни\
      \ на колёсах, обтянутые мокрыми кожами. \nДесятки воинов возятся вокруг - подтягивают канаты, смазывают оси дёгтем,\
      \ \nпроверяют крепления. Пахнет свежеструганным деревом, железом, дёгтем. \nСлышны удары молотков, скрип колёс, команды\
      \ мастеров. Таран нацелен на \nглавные врата Суздаля - его железная голова отполирована от ударов. Башни \nвыше крепостных\
      \ стен - с них будут стрелять лучники.\n"
    examine: "Таран длиной в двадцать локтей, подвешен на цепях внутри деревянного навеса. \nЖелезная голова отлита в форме\
      \ бараньей морды - рога загнуты, глаза пусты. \nГоворят, её освятил шаман, влив в металл кровь жертвенного барана. Осадные\
      \ \nбашни трёхъярусные - внутри лестницы, площадки для лучников, мостки для \nштурма. Колёса окованы железом, скрипят\
      \ под тяжестью. Рядом лежат кучи \nкамней для метания, бочки со смолой. Воины поглядывают на Суздаль с \nмрачной решимостью\
      \ - завтра пойдут на приступ.\n"
    sector: FIELD
    flags:
    - NOWEATHER
    id: room_039
    exits:
    - direction: west
      to_room: room_037
      description: К лагерю
    - direction: south
      to_room: room_038
      description: К ставке Тугарина
    - direction: north
      to_room: room_040
      description: К конюшне
  - vnum: 20040
    name: Булгарская конюшня
    description: 'Просторный шатёр из грубого войлока, пропахший конским потом и навозом.

      Вдоль стен стоят боевые кони булгарские - поджарые, с выгнутыми шеями,

      косматыми гривами. Под копытами хлюпает навоз, смешанный с соломой.

      Конюхи в кожаных фартуках чистят сбрую, бормочут заклинания-обереги.

      Слышны ржание коней, звон удил, скрип сёдел. В углу дымится котёл -

      варят ячменную кашу для лошадей. На жердях висят сёдла с серебряными

      бляхами, уздечки с амулетами-подвесками. Кони бьют копытами, чуют

      близость битвы - ноздри раздуты, глаза налиты кровью.

      '
    examine: 'Боевые кони булгар - не чета русским тяжеловозам. Степные скакуны,

      выносливые и быстрые, приучены к барабанному бою и крикам. На крупах

      выжжены тамги родовые - волк, полумесяц, змея. Конюхи шепчут им на

      булгарском наречии, гладят по холкам - верят, что конь чует судьбу

      всадника. В углу лежит седло с пробоиной от стрелы - хозяин его пал

      вчера под стенами Суздаля. Никто не берёт седло мертвеца - дурная примета.

      Запах здесь густой, животный - пот, навоз, кожа, железо. Мухи вьются

      тучами, садятся на морды коней. Слышно, как конюх поёт протяжную песню -

      о степях, о вольных табунах, о доме далёком за Волгой.

      '
    sector: FIELD
    flags:
    - PEACEFUL
    id: room_040
    exits:
    - direction: south
      to_room: room_037
      description: К лагерю
    - direction: west
      to_room: room_039
      description: К осадным машинам
  - vnum: 20041
    name: Пасека в дремучем лесу
    description: 'Глухая лесная поляна, где время течёт иначе. Меж старых дубов стоят

      ульи-колоды, выдолбленные из липовых стволов, крытые берестой. Пчёлы

      гудят густым, сонным гудом - звук древний, как сама земля. Воздух

      сладок от мёда и воска, пряный от цветов - зверобой, иван-чай, медуница.

      На травах блестит медвяная роса - капли золотистые, что не высыхают

      даже в полдень. Это место силы - здесь граница меж мирами тонка.

      Птицы поют негромко, почтительно. Солнечный свет льётся сквозь листву

      столбами, в которых пляшут пылинки-пчёлы.'
    examine: 'Пасека эта - не простая. Заложена волхвом Велимудром в стародавние

      времена, когда Суздаль ещё не стоял. Пчёлы здесь не жалят праведных,

      но грешника закусают до смерти. Мёд их целебен - заживляет раны,

      прогоняет хворь, даёт силу. А воск особенный - горит ровно, без копоти,

      не гаснет от ветра. Из такого воска и свеча неугасимая в соборе Покрова.

      Медвяная роса на травах - дар духов лесных. Кто соберёт её на рассвете

      в серебряный сосуд, тот узрит вещий сон. Ульи-колоды покрыты резьбой -

      обереги от злых духов, знаки солнца и луны. В воздухе разлита тишина

      особая - не мёртвая, а живая, дышащая. Слышно, как пчела садится на

      цветок, как капля росы падает на лист. Здесь нет войны, нет осады -

      только вечный круг жизни: цветок, пчела, мёд, воск, свет.

      '
    sector: FOREST
    flags:
    - PEACEFUL
    - NO_MAGIC
    id: room_041
    exits:
    - direction: south
      to_room: room_004
      description: Назад к лесной опушке
    - direction: up
      to_room: room_018
      description: Магический переход (к храму)
  - vnum: 20042
    name: Святилище русалок
    description: 'Подводная пещера, залитая призрачным светом. Стены покрыты водорослями,

      что светятся зеленоватым, лунным сиянием. На дне лежат раковины величиной

      с человечью голову, жемчужины крупные как орехи. Вода здесь не простая -

      тёплая, вязкая, пахнет тиной и магией. Плавают русалки - девы с длинными

      зелёными волосами, рыбьими хвостами, глазами без зрачков. Поют они

      протяжно, на языке древнем - слова непонятны, но душу берут за живое.

      Меж камней лежат кости утопленников, обросшие ракушками. На сводах

      пещеры высечены знаки - руны водяные, что старше человечьей памяти.'
    examine: 'Святилище это - сердце Нерли-реки, обитель русалок-берегинь. Они не злы,

      но и не добры - служат реке, а река служит земле. Утопленников хоронят

      здесь с почестями - кости складывают в раковины, украшают водорослями.

      Русалки знают все тайны реки - где брод, где омут, где клад на дне.

      Могут помочь праведнику, но лжеца утопят без жалости. Жемчужины здесь

      не простые - каждая хранит душу утопленника. Кто возьмёт жемчужину без

      спроса, того проклянут русалки - будет видеть мертвецов во сне, слышать

      их зов. А кто попросит с почтением, получит дар - жемчужина отведёт

      утопление, спасёт от водяного. На стенах высечена история - как Велимудр

      заключил договор с русалками, как они обещали хранить Суздаль, пока

      река течёт. Вода в пещере - живая, целебная. Кто омоется здесь, смоет

      грехи малые, обретёт ясность ума. Но долго находиться нельзя - русалки

      ревнивы, могут не отпустить. Песня их - как наваждение: слушаешь и

      забываешь о мире верхнем, хочется остаться навеки в зелёном сумраке.

      '
    sector: WATER_SWIM
    flags:
    - DARKED
    - NO_MAGIC
    id: room_042
    exits:
    - direction: up
      to_room: room_030
      description: Магический переход (к сокровищнице)
    - direction: west
      to_room: room_024
      description: К главному подземному коридору
  - vnum: 20043
    name: Меж двух миров
    description: "Нереальное пространство, где земля и небо сплелись в узор судьбы. Под ногами - \nкаменный круг, испещрённый\
      \ древними знаками, что светятся призрачным сиянием. \nНад головой парят две луны - белая, чистая как лебяжий пух, и\
      \ чёрная, глухая \nкак воронье крыло. Меж ними вьются два пути: огненный - алый, дымный, \nпульсирующий жаром, и водный\
      \ - синий, текучий, манящий прохладой. Белая лебедь \nкружит над водным путём, роняя перья-снежинки. Чёрный ворон каркает\
      \ над \nогненным, и каждый крик его - эхо будущих криков. Воздух густ, словно мёд, \nпахнет ладаном и полынью, стариной\
      \ и магией."
    examine: "Приглядевшись к каменному кругу, различаешь руны - одни знакомы по бабкиным \nсказкам, другие чужды, словно\
      \ с иной земли пришли. В центре круга - две капли: \nкровавая и слёзная, не смешиваются, но тянутся друг к дружке. Лебедь\
      \ и ворон \nне птицы вовсе - души, облечённые в перья. Смотришь на них - и видишь лица: \nженское, светлое, скорбное,\
      \ и мужское, тёмное, страстное. Это Забава и Аюп, \nкакими были в жизни прошлой, когда волхвами слыли и друг друга сгубили.\
      \ Пути \nогня и воды ведут не в пространстве - в судьбе. Выбор здесь не ногами делается, \nа сердцем.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    - NO_MAGIC
    id: room_043
    exits:
    - direction: down
      to_room: room_023
      description: Назад на крышу башни
    - direction: north
      to_room: room_044
      description: К пути огня (судьба Суздаля)
    - direction: south
      to_room: room_045
      description: К пути воды (судьба Забавы)
  - vnum: 20044
    name: Видение пепла
    description: "Огненный путь обрывается пропастью, над которой клубится дым. Внизу - Суздаль, \nобъятый пламенем. Белокаменные\
      \ стены трещат, чернеют, рушатся под таранами. \nСобор Покрова пылает - золотой купол плавится, стекает огненными слезами.\
      \ На \nвалах - горстка защитников, окружённых морем булгарских мечей. Алёша Попович \nбьётся у врат, но стрелы кончились,\
      \ щит расколот, кровь заливает очи. Воевода \nПутята стоит на коленях среди мёртвых дружинников, седая борода в пепле.\
      \ А на \nвысокой башне - Забава, в белом саване, волосы распущены, лицо в слезах."
    examine: "Всматриваясь в пламя, видишь детали страшные: младенец плачет в горящей избе, \nстаруха молится на коленях,\
      \ пока огонь пожирает её косы. Дружинник ползёт с \nотрубленной ногой, оставляя кровавый след. Булгары врываются в собор,\
      \ топчут \nиконы, рубят священника у алтаря. Неугасимая свеча гаснет - и в тот миг рушится \nпоследняя стена. Аюп стоит\
      \ на пепелище, лицо его искажено горем - он нашёл \nЗабаву мёртвой, сжимающей в руке костяной гребень. Ворон садится\
      \ на его плечо, \nшепчет: \"Проклятье свершилось. Снова.\" Это не просто гибель града - это \nповторение древней трагедии,\
      \ круг, что не разорвать.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    - DARKED
    id: room_044
    exits:
    - direction: south
      to_room: room_043
      description: Назад к месту снов
  - vnum: 20045
    name: Видение росы
    description: "Водный путь струится в долину, где Суздаль стоит целым, омытым утренней росой. \nБелокаменные стены сияют\
      \ под солнцем, на валах - не воины, а дети, пускающие \nбумажных змеев. Собор Покрова звонит в колокола - не тревожно,\
      \ а радостно, \nпризывая на праздник. На площади - хороводы, гусляры играют, девицы поют. \nВоевода Путята седобород,\
      \ но улыбается, обнимая дочь. Алёша Попович рядом с \nЗабавой, держит её за руку, на пальце - кольцо венчальное. А за\
      \ стенами - не \nбулгарский стан, а поле цветущее, где пасутся кони. На холме - два шатра: белый \nи чёрный, рядом."
    examine: "Приглядевшись, замечаешь: это не просто мир, а мир иной - где прошлое исправлено. \nЗабава и Аюп не муж с женой,\
      \ но союзники - она осталась в Суздале, он вернулся \nв Булгар, но меж градами теперь мост, а не меч. Раз в год они\
      \ встречаются на \nхолме, приносят дары - она мёд да воск, он шёлк да пряности - и вспоминают \nжизнь прошлую, когда\
      \ были волхвами-врагами. Вспоминают - и прощают. Неугасимая \nсвеча в соборе горит ярче прежнего - её питает не воск,\
      \ а любовь к миру. \nДружинник Ратибор не хромает - нога исцелена, сын жив, жена здорова. Тугарин \nЗмеевич изгнан,\
      \ ползает гадюкой в степи, не смея приблизиться. Волхв Велимудр \nстоит на пороге собора, слепые очи его плачут - слезами\
      \ радости. Лебедь шепчет: \n\"Это возможно. Если выберешь жертву, а не месть. Если разорвёшь круг.\"\n"
    sector: INSIDE
    flags:
    - INDOORS
    - PEACEFUL
    id: room_045
    exits:
    - direction: north
      to_room: room_043
      description: Назад к месту снов
