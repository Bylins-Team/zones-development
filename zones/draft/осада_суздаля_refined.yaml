  - vnum: 20013
    name: Внутренний двор кремля
    description: "Просторный двор меж белокаменных палат, вымощенный плитами, меж коих проросла трава. \nВ центре - колодец\
      \ дубовый, вкруг него толпятся раненые на окровавленной соломе. \nЛекари в запятнанных рубахах снуют меж стонущих, священник\
      \ кропит святой водой. \nВоздух густ от запахов: кровь, гной, ладан церковный, горькие травы лекарские. \nСлышны стоны\
      \ да молитвы, звон котлов - варят похлёбку для защитников. \nНа камнях - бурые пятна крови, что не отмыть. С валов доносится\
      \ колокольный звон.\n"
    examine: "Колодец выдолблен из целого дуба, оковы железные. На срубе - зарубки счётные: \nвосемь дней осады. Возле северной\
      \ стены - кузница полевая, молоты бьют, правят \nмечи да латы. У восточной палаты - штабель гробов сосновых, плотник\
      \ тешет новые. \nДети носят воду из колодца, старухи рвут полотно на бинты. Над двором кружит \nворонья стая - чует\
      \ поживу.\n"
