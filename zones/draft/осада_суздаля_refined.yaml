  - vnum: 20007
    name: Восточный вал
    description: 'Земляной вал, ощетинившийся кольями да рогатками, тянется вдоль восточной стены.

      Под ногами хрустят осколки стрел, камни покрыты бурыми пятнами крови.

      Лучники в кольчугах сидят на корточках, перевязывают раны, точат наконечники.

      Пахнет потом, кровью, свежевскопанной землёй - вал подсыпали после вчерашнего пролома.

      За зубцами стены виднеется чёрное море булгарских шатров, дымы костров застят небо.

      Барабанный бой доносится оттуда - глухой, мерный, как биение сердца земли.

      Котёл с кипящей смолой дымится над костром, едкий смрад щиплет глаза.

      '
    examine: 'Вал насыпан в три человеческих роста, укреплён брёвнами и дёрном.

      Колья заострены и обожжены на концах - чтоб не гнили.

      На одном из кольев висит булгарский щит с пробоиной от копья - трофей.

      В земле торчат обломки стрел - и русских, и булгарских, не разобрать.

      Лучники молчаливы, лица закопчены, глаза красные от бессонницы.

      Один точит стрелу, бормочет молитву: "Покров Пресвятой, укрой нас..."

      '
