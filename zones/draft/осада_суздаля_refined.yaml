  - vnum: 20009
    name: Юго-восточный угол стены
    description: 'Угол крепостной стены, где сходятся восточная и южная линии обороны.

      Здесь земля пропитана кровью - чернеет, липнет к подошвам.

      Последний штурм был особенно жестоким: камни выбиты, брёвна расщеплены.

      На белом камне видны странные борозды - словно когти нечеловеческие царапали стену.

      Пахнет кровью, страхом, чем-то гнилостным и нечистым - будто могила разверзлась.

      Воронье кружит над этим местом, каркает зловеще, не садится.

      Ратники обходят угол стороной, крестятся, шепчут: "Нечисть тут ходила..."

      '
    examine: 'Борозды на камне глубокие, идут сверху вниз - будто кто-то лез по стене.

      Но ни один человек таких когтей не имеет - это звериные, а то и хуже.

      В расщелинах камня застряли клочья чёрной шерсти, пахнут серой и падалью.

      Земля у основания стены взрыта, словно кто-то рыл подкоп - но яма неглубокая, брошенная.

      На камнях нацарапаны защитные знаки - кресты, громовые колёса, но половина стёрта.

      Старый дружинник шепчет: "Тугарин Змеевич оборотнем приходил, стену испытывал. Серебром его бить надобно..."

      '
