  - vnum: 20008
    name: Восточная башня
    description: 'Каменная башня вздымается над валом, словно страж бессонный.

      Стены белокаменные, но почернели от копоти пожарищ.

      Узкие окна-бойницы глядят на булгарский стан, как щели в шлеме ратника.

      Внутри сумрачно, пахнет сыростью, старым камнем, кровью.

      На крыше реет флаг Суздаля - чёрный ворон на белом поле, рваный от стрел.

      Скрипят деревянные конструкции - лестницы, помосты, стропила.

      Слышны голоса часовых наверху, лязг оружия, чей-то сдавленный кашель.

      '
    examine: 'Башня сложена из белого камня ещё при воеводе Путяте-деде.

      В кладке видны древние знаки - солнечные кресты, обереги от нечисти.

      На стенах нацарапаны имена защитников: "Ратибор был здесь", "Добрыня держал стену".

      Лестница винтовая, ступени стёрты тысячами ног, местами скользкие от крови.

      В углу стоит бочка с водой для тушения пожаров, ковш плавает на поверхности.

      У основания лестницы - тёмный проём, завешенный рогожей. Оттуда тянет могильным холодом.

      '
