  - vnum: 20011
    name: Западный вал
    description: 'Земляной вал, утоптанный сапогами тысяч ратников за долгие годы.

      Здесь бьётся сердце обороны - Алёша Попович держит главную позицию.

      Вал весь изрыт воронками от камнемётов, ощетинился кольями да рогатками.

      Воздух густ от дыма костров, пота, крови - запах битвы не выветрить.

      Под ногами хлюпает грязь, смешанная с пеплом и запёкшейся кровью.

      Слышны боевые кличи, звон мечей о щиты, стоны раненых, ржание коней.

      Над валом вьются вороны - ждут пиршества.

      '
    examine: 'На кольях насажены булгарские шлемы - трофеи да устрашение врагу.

      Меж брёвен укреплений видны амулеты-обереги - подковы, узлы наузы, крестики.

      Земля пропитана кровью стольких битв, что трава здесь не растёт.

      У подножия вала громоздятся мешки с песком, бочки со смолой, вязанки стрел.

      Видны следы ночного штурма - обломки лестниц, застрявшие в валу крюки.

      '
