  - vnum: 20005
    name: Нерль-река, излука
    description: 'Река Нерль течёт здесь быстро, огибая каменистый мыс.

      Вода мутная, красноватая от крови павших - смывает поле брани.

      На берегу валуны, поросшие изумрудным мхом, скользкие от речных брызг.

      Течение холодное, злое - так и норовит сбить с ног, утащить на дно.

      Под водой, меж камней, чернеет провал - вход в подводную пещеру.

      Пахнет водорослями, речным илом, чем-то древним и магическим - словно духи водяные здесь обитель имеют.

      Слышен плеск волн да далёкий барабанный бой с осадного стана.

      '
    examine: 'Вглядевшись в тёмную воду, различишь под поверхностью каменную кладку - рукотворную, древнюю.

      Это вход в подземный ход, что прорыт был при основании града.

      Камни покрыты странными знаками - не христианскими, не языческими, а иными, забытыми.

      На берегу, меж валунов, лежит истлевший венок из водяных лилий - кто-то приносил требу русалкам.

      Вода здесь не просто холодна - она обжигает, словно лёд огненный.

      Чувствуется: место это пограничное, меж миром живых и миром духов речных.

      '
    sector: WATER_SWIM
