  - vnum: 20006
    name: Главные врата Суздаля
    description: 'Мощные дубовые врата, окованные железом, изрыты от ударов тарана.

      Древесина расщеплена, но держит - крепость дедовская не сдаётся.

      Над вратами боевая позиция - ратники со стрелами, котлы с кипящей смолой на цепях.

      БУМ! БУМ! БУМ! - таран бьёт мерно, как сердце исполинское. Земля дрожит от ударов.

      Пахнет смолой горячей, кровью, потом ратным, железом раскалённым.

      Сквозь щели в воротах видно поле боя - чёрное море булгарских щитов.

      Слышны крики: "Держать! Держать врата!" - голос Алёши Поповича, хриплый от напряжения.

      Дым застилает глаза, искры летят от факелов.

      '
    examine: 'Врата сработаны искусно - дуб морёный, толщиной в три ладони, скреплён коваными полосами.

      На железе вмятины глубокие - таран бил уже сотни раз, но не пробил.

      Над вратами, на боевом помосте, стоят котлы чугунные - в них булькает смола, готовая пролиться на головы штурмующих.

      Ратники измотаны - лица закопчённые, руки в ожогах, но глаза горят яростью.

      У подножия врат, с внутренней стороны, сложены подпорки - брёвна дубовые, что не дают воротам рухнуть.

      На земле кровавые пятна - здесь недавно перевязывали раненого.

      Чувствуется: это последний рубеж - падут врата, падёт и град.

      '
    sector: CITY
