zone:
  meta:
    id: suzdal_siege
    name: Осада Суздаля
    author: Zone Generator
    version: '1.0'
    description: Волжские булгары штурмуют древний град на реке Нерль ради прекрасной Забавы Путятичны, дочери воеводы. Эпическая
      битва разворачивается у стен белокаменного города, где русичи держат оборону против несметных полчищ.
    recommended_level:
    - 13
    - 18
    entrance_rooms:
    - room_001
  lore:
    history: Суздаль-град стоит на Нерли-реке с времён князя Владимира Красно Солнышко, когда волхв Велимудр нарёк сие место
      «судным» - здесь вершились тяжбы меж племенами. Воевода Путята Вышатич воздвиг белокаменный кремль и собор Покрова,
      украсив его резьбой искуснее птичьих перьев. Семь раз приходили булгары под стены, семь раз отбивали их дружинники,
      но на восьмой раз узрел булгарский князь Аюп дочь воеводы Забаву на крепостной стене - и запало ему в сердце пламя страсти
      жгучей. Собрал он несметное войско от Волги до Камы-реки, поклялся взять град али полечь костьми под его стенами.
    folklore_basis: 'Основа - троянский миф о похищении Елены, переложенный на почву русских былин. Перекликается с былиной
      «Добрыня и Маринка» (похищение красавицы чародеем), историческими походами булгар на Владимиро-Суздальские земли (1107,
      1164 года). Мотив вещего сна Забавы взят из «Слова о полку Игореве» (сон Святославов). Образ Алёши Поповича как защитника
      града - из цикла киевских былин. Осадные поверья: кипящая смола отгоняет нежить, колокольный звон укрепляет дух защитников,
      барабанный бой булгарский навевает морок. Легенда о том, что град не падёт, пока горит неугасимая свеча в соборе Покрова
      - местное суздальское предание.'
    current_state: 'Восьмой день стоят булгарские полчища под стенами Суздаля. Чёрные шатры растянулись от леса до речной
      излуки, дымы костров застят солнце. У стен громоздятся тараны-«бараны», осадные башни на колёсах скрипят, подступая
      к валам. Защитники измотаны - стрелы на исходе, смола в котлах кончается, раненых некуда класть. Воевода Путята седобород
      стал, а дочь его Забава заперлась в высокой башне, молится Покрову Богородицы. Алёша Попович с дружиной малой держит
      главные врата, а на посаде уже пожарища дымятся. Булгарский князь Аюп шлёт гонцов: отдайте Забаву - отведу рати, не
      отдадите - сравняю град с землёй.'
    conflict: 'Двойная драма терзает Суздаль: осада военная и осада сердечная. Князь Аюп, могучий батыр и чародей, одержим
      страстью к Забаве - он видел её в вещем сне ещё до похода, и теперь верит, что судьба их связала. Воевода Путята разрывается
      меж долгом защитника и любовью отцовской - отдать дочь супостату или обречь град на гибель? Забава же втайне видела
      те же вещие сны, что и Аюп, и сердце её мечется меж ужасом плена и странным влечением к врагу. Алёша Попович клялся
      Забаве в верности, но она не дала ему ответа. Тем временем среди защитников зреет смута - одни требуют биться до конца,
      другие шепчут о выдаче княжны ради спасения жён и детей. А в булгарском стане батыр Тугарин Змеевич, соперник Аюпа,
      плетёт интригу - хочет сам взять град и Забаву в придачу.'
    key_characters:
    - name: Забава Путятична
      role: Яблоко раздора, пророчица
      description: 'Дева неописуемой красы, что косы золотые до пят, очи синие как Нерль-река. Видит вещие сны с детства -
        предрекла неурожай, мор скота, нынче же видит два пути: в одном сне град горит и она плачет на пепелище, в другом
        - стоит в булгарском шатре царицей, а Суздаль цел. Мечется меж долгом и судьбой, молится Богородице о знамении.'
    - name: Воевода Путята Вышатич
      role: Защитник града, отец Забавы
      description: 'Седой богатырь, что сорок лет держит меч за Русь. Лицо изборождено шрамами, длань правая искалечена в
        бою с половцами. Суров, но справедлив. Любит дочь паче жизни, но присягу князю чтит выше. Знает: отдаст Забаву - опозорит
        род, не отдаст - погубит тысячи душ. По ночам молится в соборе, просит совета у икон.'
    - name: Алёша Попович
      role: Главный защитник, жених Забавы
      description: Молодой богатырь из Ростова, сын попа соборного. Хитёр умом, ловок в бою, метко стреляет из лука. Влюблён
        в Забаву с весны, когда на Красной горке хороводы водили. Ревнует её даже к врагу невидимому, клянётся отсечь Аюпу
        голову. Водит малую дружину - тридцать молодцев отборных, держит главные врата Суздаля. Втайне боится, что Забава
        видит в нём не богатыря, а мальчишку.
    - name: Князь Аюп Булгарский
      role: Предводитель осады, одержимый страстью
      description: Батыр сорока лет, высок и широкоплеч, борода чёрная с проседью. Искусен в магии - учился у волжских шаманов,
        носит амулеты-обереги, знает заклятья боевые. Три жены имеет в Булгаре, но Забаву возжелал после вещего сна, где она
        стояла на мосту меж двух миров. Верит, что их союз предначертан духами. Жесток к врагам, но благороден - обещал не
        трогать мирных жителей, коли Забаву отдадут добровольно.
    - name: Батыр Тугарин Змеевич
      role: Соперник Аюпа, интриган
      description: Молодой булгарский воин, сын шамана-оборотня. Прозван Змеевичем за хитрость и яд на языке. Завидует Аюпу,
        мечтает сам стать князем. Шепчет воинам, что Аюп обезумел от колдовства русской ведьмы, что пора брать град штурмом
        и делить добычу. Втайне ведёт переговоры с изменниками в Суздале, обещая золото за открытые ворота. Мечтает убить
        и Аюпа, и Забаву - чтоб никто не достался.
    - name: Волхв Велимудр
      role: Хранитель тайн, пророк
      description: Древний старец, что помнит ещё крещение Руси. Живёт в келье под собором Покрова, стережёт неугасимую свечу
        - пока горит, град стоять будет. Слеп телесными очами, но видит духовными. Знает секрет вещих снов Забавы и Аюпа -
        их души связаны в прошлой жизни, когда оба были волхвами-соперниками. Может открыть правду, но молчит, ибо судьба
        должна свершиться сама.
    - name: Дружинник Ратибор Хромой
      role: Глава изменников, отчаявшийся воин
      description: Седой воин, искалеченный в прошлой осаде - хромает на левую ногу. Потерял сына в вылазке три дня назад,
        жена умирает от ран. Возглавляет тайный круг дружинников, что хотят открыть ворота булгарам ночью - лишь бы кончилась
        бойня. Терзается меж честью и болью, пьёт хмель, чтоб заглушить совесть. Тугарин подкупил его обещанием пощады семьям.
    - name: Мамка Василиса
      role: Кормилица Забавы, хранительница женской мудрости
      description: 'Старая ключница, вырастившая Забаву с пелёнок. Знает травы, заговоры, бабьи хитрости. Втайне ведунья -
        читает по звёздам, толкует сны. Говорит Забаве: «Не судьба бежать от судьбы, голубушка». Носит ей в башню хлеб да
        воду, шепчет утешения. Знает подземный ход из кремля к реке - последний путь к спасению али к гибели.'
    atmosphere:
      sounds:
      - Барабанный бой булгарский - глухой, мерный, как биение сердца земли
      - Скрип осадных башен на колёсах, стук таранов о дубовые врата
      - Колокольный звон соборный - тревожный, призывный, дрожащий
      - Крики раненых в лазарете, стоны да молитвы
      - Свист стрел, звон мечей на тренировочном дворе
      - Плач жён на посаде, причитания над убитыми
      - 'Боевые кличи: русское «Ура!» и булгарское гортанное «Алла!»'
      - Треск пожарищ за стенами, шипение кипящей смолы в котлах
      - Ржание коней в стойлах, лай собак, карканье воронья над полем брани
      smells:
      - Гарь и дым пожарищ - едкий, застилающий горло
      - Кровь и гной ран - сладковато-тошный дух лазарета
      - Ладан соборный, воск церковных свечей - островок чистоты в аду
      - Пот, кожа, железо - запах ратников на стенах
      - Кипящая смола - резкий, удушливый смрад
      - Конский навоз, прелая солома - от стойл в кремле
      - Хлеб чёрный, горох варёный - скудная пища осаждённых
      - Степные травы, полынь - ветер несёт с булгарского стана
      - Тлен и падаль - от незахороненных тел меж станов
      visuals:
      - Белокаменные стены Суздаля, почерневшие от копоти, с выбоинами от камнемётов
      - Высокая башня, где в узком окне мелькает золотая коса Забавы
      - Чёрное море булгарских шатров с красными знамёнами - полумесяц и волк
      - Осадные башни - громады деревянные, обтянутые мокрыми кожами от огня
      - Таран-«баран» с железной головой, что бьёт в ворота под прикрытием щитов
      - Собор Покрова с золотым куполом - единственное, что блестит в сумраке осады
      - Валы земляные, ощетинившиеся кольями да рогатками
      - Костры на стенах - огненные точки в ночи, глаза града бессонного
      - Поле меж станов - изрытое, усеянное стрелами, телами павших, воронами
      - Нерль-река, покрасневшая от крови, несущая щепки да щиты
      - 'Вещий сон Забавы (видение): два пути - огненный и водный, над ними парят белая лебедь и чёрный ворон'
      feeling: Удушливое напряжение последних дней осады - когда силы на исходе, надежда тлеет, а рок нависает неотвратимый.
        Величие трагедии в духе древнегреческой - герои обречены, но держатся до конца. Романтика обречённости - красота на
        краю гибели. Эпический размах - судьбы тысяч в руках немногих. Мистический ужас вещих снов - ощущение, что боги играют
        людьми как шахматными фигурами.
    secrets:
    - Подземный ход из башни Забавы к Нерли-реке - знает только мамка Василиса. Прорыт ещё при основании града, замурован,
      но можно открыть. Ведёт к пещере русалок под водой.
    - Неугасимая свеча в соборе Покрова - зажжена волхвом Велимудром при освящении града. Пока горит - град не падёт. Но фитиль
      на исходе, воск тает. Можно принести особый воск с пасеки в лесу, где пчёлы питаются медвяной росой.
    - Вещие сны Забавы и Аюпа - не случайность, а родовое проклятье. В прошлой жизни они были волхвами-соперниками, убили
      друг друга в поединке. Теперь судьба сводит вновь - разорвать круг можно лишь жертвой одного ради другого.
    - Тугарин Змеевич - оборотень, сын шамана-змея. Ночами принимает облик гадюки, проникает в Суздаль, шепчет яд в уши изменникам.
      Убить можно лишь серебряным клинком, освящённым в соборе.
    - Ратибор Хромой - не изменник по натуре, а отчаявшийся отец. Можно спасти его жену зельем от мамки Василисы - тогда он
      откажется от предательства и выдаст заговор Тугарина.
    - Алёша Попович владеет тайной - его отец-поп хранит частицу Креста Господня в соборе. Освящённая ею стрела может убить
      любого чародея, даже Аюпа. Но поп не отдаст святыню для убийства - нужно убедить его, что это воля Божья.
    - 'Князь Аюп не просто влюблён - он проклят. Волжская шаманка предрекла: найдёт любовь в граде белокаменном, но обретя
      её, потеряет всё. Он знает о проклятье, но идёт навстречу судьбе.'
    - В булгарском стане есть пленный русич - купец Гостомысл, которого взяли в полон на Волге. Он знает слабое место в обороне
      Суздаля (тайный лаз в валу), но молчит. Можно выкупить его или освободить тайно.
    - Волхв Велимудр - не человек, а дух-хранитель града, принявший плоть. Когда Суздаль падёт (если падёт), он обратится
      в белого тура и унесёт душу града в иной мир. Но можно упросить его открыть истинную судьбу Забавы.
    - 'Забава носит под сорочкой амулет - гребень костяной, что достался от бабки-ведуньи. Гребень хранит память рода Путятичей.
      Если расчесать им волосы на рассвете на крепостной стене - явится видение: истинный путь спасения града.'
  rooms:
  - vnum: 20001
    name: Поле боя перед Суздалем
    description: "Распоротая земля чернеет ранами воронок да рвов. Стрелы торчат из грязи, как щетина \nна хребте вепря. Обломки\
      \ щитов, расщеплённые древки копий, шлемы с пробоинами. \nДымы костров застят солнце - день стал сумрачен, как вечер.\
      \ На юге белеют стены \nСуздаля, на севере чернеет море булгарских шатров. Запах гари въелся в горло, \nкровь и конский\
      \ пот смешались с вонью падали. Слышны боевые кличи - русское \n\"Ура!\" и булгарское гортанное \"Алла!\". Скрипят осадные\
      \ башни, стучат тараны \nо дубовые врата. Вороньё кружит над полем, каркает жадно.\n"
    examine: "Земля истоптана тысячами ног - русских да булгарских, конских да людских. \nМеж станов - ничья полоса смерти,\
      \ где лежат павшие обеих ратей. Никто не \nсмеет выйти забрать тела - стрелы свистят с обеих сторон. Вдали видна \n\
      высокая башня Суздаля, где в узком окне мелькает золотая коса. Забава \nсмотрит на поле боя - али молится, али плачет.\
      \ Барабаны гудят в булгарском \nстане - мерно, как биение сердца земли. Восьмой день длится осада, и конца \nей не видать.\n"
    sector: FIELD
    flags: []
    id: room_001
    exits:
    - direction: north
      to_room: room_002
      description: К булгарскому стану
    - direction: east
      to_room: room_003
      description: К восточному краю поля боя
    - direction: south
      to_room: room_006
      description: К крепостным стенам Суздаля
    - direction: west
      to_room: room_036
      description: К главному шатру Аюпа
  - vnum: 20002
    name: Северный край булгарского стана
    description: "Лес чёрных шатров растянулся до самой опушки. Красные знамёна с полумесяцем \nда волком хлопают на ветру.\
      \ Воины в кольчугах сидят у костров - точат мечи, \nвяжут тетивы, чинят доспехи. Запах дыма, варёного мяса, конского\
      \ навоза. \nКони ржут в загонах, скребут копытами землю. Барабаны гудят где-то в центре \nлагеря - глухо, тревожно.\
      \ Часовые в остроконечных шлемах стоят меж шатрами, \nкосятся на чужаков подозрительно. Слышна чужая речь - булгарская,\
      \ гортанная, \nс присвистом. Пахнет степными травами, полынью - ветер несёт с Волги.\n"
    examine: "Шатры добротные, из войлока да кож. У каждого - древко с бунчуком, знак \nсотни. Воины разношёрстные - есть\
      \ булгары чистокровные, смуглые да черноволосые, \nесть половцы наёмные, есть мордва лесная. Все вооружены до зубов\
      \ - сабли кривые, \nлуки составные, копья длинные. Смотрят на русичей с ненавистью - восемь дней \nбьются, много крови\
      \ пролито. Но дисциплина железная - без приказа князя Аюпа \nникто не тронет. В центре стана виднеется шатёр огромный\
      \ - красный, с золотым \nшитьём. Там ставка Аюпа.\n"
    sector: FIELD
    flags: []
    id: room_002
    exits:
    - direction: south
      to_room: room_001
      description: Назад на поле боя
    - direction: north
      to_room: room_037
      description: Глубже в булгарский стан
    - direction: east
      to_room: room_003
      description: К восточным позициям
    - direction: west
      to_room: room_036
      description: К ставке князя Аюпа
  - vnum: 20003
    name: Восточное поле боя
    description: "Изрытое поле, где шла жестокая сеча три дня назад. Тараны-«бараны» стоят \nнеподвижно - их деревянные башни\
      \ обгорели, обтянутые кожи почернели. Осадная \nбашня на колёсах завалилась набок, колёса торчат в небо. Земля усеяна\
      \ трупами - \nрусичи да булгары лежат вперемешку, уже раздулись, почернели. Вороны рвут мясо, \nкаркают, дерутся меж\
      \ собой. Запах смерти удушливый - сладковатый, тошный. \nСлышны выстрелы с крепостной стены - лучники отгоняют булгар,\
      \ что пытаются \nподобраться к таранам. Свист стрел, звон щитов, крики раненых. На востоке \nтемнеет лес - там прячутся\
      \ булгарские лазутчики.\n"
    examine: "Тараны брошены после неудачного штурма. Алёша Попович с дружиной отбил приступ, \nполил нападавших кипящей смолой.\
      \ Башни загорелись, булгары отступили, оставив \nмёртвых. Теперь это ничья земля - ни тем, ни другим не подойти. Трупы\
      \ не \nубраны - стрелы свистят с обеих сторон. Вороньё пирует. Среди павших видны \nзнатные воины - у одного кольчуга\
      \ с золотым шитьём, у другого шлем с серебряной \nнасечкой. Оружие разбросано - мечи, копья, топоры. Можно подобрать,\
      \ коли \nосмелишься под стрелы лезть. Лес на востоке - опасное место. Говорят, там \nлеший хозяйничает, а булгары с\
      \ ним договор имеют.\n"
