  - vnum: 20004
    name: Лесная опушка
    description: 'Край дремучего леса, где вековые ели почернели от дыма осадных костров.

      Тишина здесь зловещая - ни птичьего щебета, ни шороха зверя.

      Земля мягкая, устлана бурой хвоей и прелыми листьями.

      На влажной почве видны свежие следы - чьи-то ноги прошли недавно, спешно.

      Пахнет смолой сосновой, грибами да чем-то горьким - полынью степной, что ветер несёт с булгарского стана.

      Меж стволов мелькают отблески далёких пожарищ.

      Ветви нависают, словно когтистые длани.

      '
    examine: 'Приглядевшись, различишь на коре старой ели зарубку - знак тайный, что оставляют лесные ходоки.

      Следы на земле двоякие: одни - сапоги ратные, другие - лапти крестьянские.

      Кто-то водит здесь тайные тропы меж градом и лесной глушью.

      Под корнями вывороченной бури берёзы блестит что-то медное - обронённый нательный крест.

      Воздух здесь странный - будто меж мирами граница пролегла.

      '
    sector: FOREST
