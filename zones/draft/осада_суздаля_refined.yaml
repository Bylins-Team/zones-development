  quests:
  - id: quest_001
    name: 'Осада Суздаля: Змеиное жало'
    type: KILL
    description: "Воевода Путята Вышатич стоит на стене, взгляд его тяжёл как свинец.\n\n«Слышал я, богатырь, что ты не робкого\
      \ десятка. Восьмой день стоим под осадой, \nа силы тают как воск на свече. Батыр Тугарин Змеевич - вот кто сеет смуту\
      \ \nв наших рядах. Оборотень он, змеиное отродье, ночами в град проникает, \nшепчет яд в уши слабым духом. Дружинники\
      \ мои начали меж собой шептаться - \nмол, отдать Забаву, спасти жён да детей.\n\nНайди Змеевича в его логове, отсеки\
      \ ему голову. Только серебром освящённым \nбить - иначе обратится гадиной и уползёт. Мамка Василиса в лазарете знает,\
      \ \nкак клинок освятить. А я тебе покажу, где Тугарин шатёр свой разбил - \nна южной окраине булгарского стана, меж\
      \ осадных машин. Там он днём отсыпается \nпосле ночных превращений.\n\nПринеси мне его голову - докажу дружинникам,\
      \ что супостат не бессмертен. \nДа и Аюпа это ослабит - без правой руки батыр что сокол без крыла».\n"
    objectives:
    - type: KILL
      target: mob_004
      count: 1
      description: Убить батыра Тугарина Змеевича в его ставке
    rewards:
      exp: 8000
      gold: 350
      items:
      - obj_silver_blade
      - obj_tugarin_amulet
      reputation:
        faction: Суздаль
        value: 500
    prerequisites:
      min_level: 16
    giver_npc: npc_putyata
    giver_room: room_014
    completion_npc: npc_putyata
    completion_room: room_014
    hints:
    - Мамка Василиса в лазарете (room_015) может освятить серебряный клинок
    - Ставка Тугарина находится на южной окраине булгарского лагеря (room_038)
    - Тугарин силён - возьми с собой дружину из 3-4 богатырей
  - id: quest_002
    name: Неугасимая свеча Велимудра
    type: COLLECT
    description: "Волхв Велимудр сидит в келье под собором, слепые очи его устремлены в пустоту.\n\n«Чую я, пришёл не праздный\
      \ гость. Слышишь - капает? То воск неугасимой свечи \nтает. Зажжена она была при основании града, когда князь Владимир\
      \ Красно Солнышко \nблагословил сие место. Пока горит - Суздаль стоять будет, погаснет - падёт \nград как подрубленный\
      \ дуб.\n\nТри дня осталось до того, как фитиль догорит. Нужен воск особый - медвяный, \nс пасеки в дремучем лесу, где\
      \ пчёлы питаются росой с цветов папоротника. \nПасека та на север от града, в чаще непролазной. Старик-пасечник Медовар\
      \ \nхранит воск заветный - три круга медвяных, что светятся в темноте как \nмесяц молодой.\n\nДа только путь туда опасен\
      \ - лес полон нежити да разбойников. А Медовар \nчудной - не каждому воск отдаст. Говорят, загадки загадывает, да былины\
      \ \nстаринные слушать любит. Принеси три круга воска - продлю жизнь свече \nна луну полную. А там глядишь, и подмога\
      \ подоспеет».\n"
    objectives:
    - type: EXPLORE
      target: room_041
      count: 1
      description: Найти пасеку в дремучем лесу
    - type: COLLECT
      item: obj_honeywax_circle
      count: 3
      description: Собрать три круга медвяного воска
    - type: DELIVER
      item: obj_honeywax_circle
      target_npc: npc_velimudр
      count: 3
      description: Принести воск волхву Велимудру
    rewards:
      exp: 6000
      gold: 200
      items:
      - obj_velimudр_blessing
      reputation:
        faction: Суздаль
        value: 300
    prerequisites:
      min_level: 14
    giver_npc: npc_velimudр
    giver_room: room_018
    completion_npc: npc_velimudр
    completion_room: room_018
    hints:
    - Лесная опушка (room_004) - начало пути к пасеке
    - Пасечник Медовар любит былины - спой ему или расскажи историю
    - В лесу водятся лешие и волки - будь осторожен
  - id: quest_003
    name: Тайна вещих снов
    type: EXPLORE
    description: "Мамка Василиса хватает тебя за рукав, глаза её полны тревоги.\n\n«Голубушка моя, Забава-то, совсем извелась.\
      \ Третью ночь подряд один и тот же \nсон видит - стоит она на мосту меж двух миров, а по сторонам два пути: \nогненный\
      \ да водный. Над огнём ворон чёрный кружит, над водой - лебедь белая. \nИ голоса слышит: один зовёт в пламя, другой\
      \ - в студёную глубь.\n\nЗнаю я, что то не простой сон - вещий. Есть в башне её потайной ход, \nчто ведёт в меж-мирье,\
      \ где души блуждают. Гребень костяной у неё есть, \nбабкин, ведуньин. Коли расчешет им волосы на рассвете на вершине\
      \ башни - \nоткроется проход в видение. Там узрит она оба пути до конца.\n\nДа только одной ей туда нельзя - заблудится\
      \ меж миров, душа потеряется. \nНужен проводник, что крепок духом. Проводи её в видение, помоги выбрать \nпуть истинный.\
      \ Только помни - что изберёт она там, то и сбудется наяву. \nОгонь - град сгорит, но она жива останется. Вода - град\
      \ спасётся, но сама... \nОх, не знаю, не знаю».\n"
    objectives:
