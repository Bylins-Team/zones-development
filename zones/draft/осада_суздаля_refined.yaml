  - vnum: 20010
    name: Южная стена Суздаля
    description: 'Белокаменная стена тянется вдоль Нерли-реки, обращённая к водной глади.

      Здесь тише, чем на северных валах - булгары не штурмуют с этой стороны.

      Меж зубцов виден противоположный берег, где чернеют вражеские дозоры.

      Река несёт щепки да красноватую пену - след вчерашней сечи.

      Под ногами каменные плиты, местами треснувшие от времени.

      Пахнет речной водой, мокрым камнем, изредка - застарелой кровью.

      Слышен плеск волн о берег, карканье ворон, далёкий барабанный бой.

      '
    examine: 'На камнях высечены родовые знаки мастеров - трезубцы, кресты, солярные круги.

      В расщелине меж плит растёт чертополох - защитная трава от нечисти.

      Видны следы старых пожаров - копоть на белом камне не отмыть.

      Внизу, у основания стены, темнеет лаз - то ли водосток, то ли тайный ход.

      '
