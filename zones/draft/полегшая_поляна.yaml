zone:
  meta:
    id: zone_ghostly_meadow
    name: Полегшая поляна
    author: Zone Generator
    version: '1.0'
    description: На рассвете вы оказываетесь в старом поле, покрытом буйной травой
      и низкими кустами. Тут и там можно заметить следы недавних пожарищ – черные
      деревья и обугленную землю. В тишине слышны странные шепоты и скребущие звуки,
      словно здесь присутствуют невидимые существа.
    recommended_level:
    - 10
    - 15
  lore:
    history: Недалеко от древнерусской деревни Полукров стоит заброшенное поле, когда-то
      плодородное и зеленое. Однако после трагической битвы между местными жителями
      и набегом варваров, все живые существа покинули это место, а поля остались пустыми
      и забытыми. С тех пор здесь можно заметить следы сожженных деревьев и черной
      земли, свидетельствующие о том, что здесь произошла жестокая битва.
    folklore_basis: Согласно славянским поверьям, места, где умерло много людей без
      должного почитания или в результате трагических событий, становятся обителью
      нежити. Мертвецы и духи остаются там, где они пали, не находя покоя до тех пор,
      пока их души не будут вознесены или отпущены.
    current_state: Сейчас Полегшая поляна окутана легким туманом, придающим ей мрачный
      и загадочный вид. Спящие мертвецы иногда пробуждаются из своих могил, когда
      кто-то нарушает их покой или присутствует в поле ночью. Изредка можно встретить
      бродячую ведьму, ищущую составляющие для своих зелий.
    conflict: Основной конфликт связан с тем, что мертвецы поляны продолжают устраивать
      проблемы местным жителям, не давая им нормально жить. Игроки могут быть отправлены
      туда, чтобы найти способ успокоить души погибших и освободить поле от проклятия.
    key_characters:
    - name: Ветряная Ведьма
      role: Бродит по поляне в поисках редких трав для своих зелий
      description: Сухая и костлявая женщина с длинными серыми волосами, облаченная
        в старое платье. В ее глазах можно заметить отблеск магии и печаль.
    - name: Старый Батюшка
      role: Житель соседней деревни, которому доверяют местные жители
      description: Пожилой мужчина с бородой, облаченный в простую рубаху. Его глаза
        полны мудрости и печали, он может рассказать многое о прошлом поляны.
    atmosphere:
      sounds:
      - Странный шепот из-за кустов
      - Скребущие звуки приближающегося движения
      smells:
      - Плесень и древесина сгоревших деревьев
      - Земляной запах заброшенного поля
      visuals:
      - Легкий туман, окутывающий всю поляну
      - Черные обугленные стволы деревьев среди зеленой травы
      feeling: В Полегшей Поляне царит неприятное чувство опасности и печали. Место
        кажется заброшенным, но в то же время полным тайн.
    secrets:
    - Спрятались магические травы, которые необходимы для создания зелий для успокоения
      духов
    - Под старым сгоревшим деревом спрятана ритуальная книга местного колдуна, которую
      можно использовать в определенных квестах
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Темный проход, ведущий внутрь заброшенного поля. Легкий туман окутывает
      все пространство, придавая ему мрачный вид. Черные обугленные стволы деревьев
      и зеленая трава создают контраст.

      Слышны странные шепоты из-за кустов и скребущие звуки приближающегося движения.
      Запах плесени и древесины сгоревших деревьев смешивается с земляным запахом
      заброшенного поля.

      Ощущается холодная влажность, проникающая до костей.

      '
    examine: 'Проход кажется старым и забытым. В стене видны следы пожара и разрушения.
      Возможно, это вход в подземный коридор или башню стража.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
      description: Ведет к башне стражи.
    - direction: down
      to_room: room_003
      description: Низкий вход в подземный коридор.
    - direction: south
      to_room: world_forest_01
      description: Выход на заброшенное поле.
  - id: room_002
    vnum: 20002
    name: Башня стража
    description: 'Была когда-то башней стражи, сейчас же напоминает разрушенный склеп.
      Черные обугленные стены и руины деревянных элементов создают мрачную атмосферу.

      Слышатся странные шепоты и тихие звуки шагов, будто кто-то бродит по этажам.
      Запах гари и древесины смешивается с пылью старых времен.

      Ощущается холодный ветер сквозь дыры в стенах.

      '
    examine: 'Башня напоминает место, где когда-то жил сторож. На стене можно заметить
      следы старой каллиграфии и рисунки древних символов.

      Возможно, здесь спрятаны секреты или предметы, связанные с прошлым поляны.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_001
      description: Вход в темный вход.
    - direction: up
      to_room: room_007
      description: Лестница на верхний этаж, где можно найти редкие травы для зелий.
    - direction: east
      to_room: room_004
      flags:
      - HIDDEN
      description: Скрытый проход в башне.
  - id: room_003
    vnum: 20003
    name: Подземный коридор
    description: 'Темный и узкий подземный коридор, освещенный лишь слабым светом
      издалека. Стены покрыты мхом и плесенью, а пол скользит от влаги.

      Слышатся тихие звуки капающей воды и шорохи подземных существ. Запах сырости
      и древесины смешивается с металлом старых механизмов.

      Ощущается холод и сырость, проникающая до костей.

      '
    examine: 'Коридор напоминает древнее туннельное сооружение. На стенах можно заметить
      следы древних рисунков и надписей. Возможно, здесь спрятано что-то ценное.

      Следует быть осторожным, так как коридор может вести к опасностям.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: up
      to_room: room_001
      description: Вход на поверхность.
    - direction: north
      to_room: room_004
      description: Развилка, ведущая к боссу.
    - direction: east
      to_room: room_005
      description: Путь к сокровищам.
  - id: room_004
    vnum: 20001
    name: Зал с ловушками
    description: 'Зал освещен лишь слабыми лучами света, пробивающимися сквозь щели
      в камнях. Здесь можно заметить следы древних механизмов и остатки поврежденных
      ловушек. Стены украшены черными пятнами от копоти, а воздух наполнен запахом
      ржавчины и пыли.

      '
    examine: 'В углу виднеется старая карта с пометками о различных ловушках. Несколько
      механизмов по-прежнему кажутся активными, требуя осторожности.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_003
      description: Темный коридор ведет к следующей комнате.
    - direction: north
      to_room: room_006
      description: Зал тянется дальше на север, где обитает босс.
    - direction: west
      to_room: room_002
      flags:
      - HIDDEN
      description: Скрытый проход ведет к другой комнате.
  - id: room_005
    vnum: 20002
    name: Сокровищница
    description: 'Зал наполнен свечами и факелами, отражающими блеск множества сокровищ.
      Здесь можно увидеть старинные монеты, драгоценности и оружие. Пахнет древним
      золотом и металлом.

      '
    examine: 'На стене висит старый шлем с эмблемой давно павшего воина. В углу лежит
      сверкающий меч с затейливым узором на рукояти.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_003
      description: Темный коридор ведет к следующей комнате.
    - direction: north
      to_room: room_006
      description: Зал тянется дальше на север, где обитает босс.
  - id: room_006
    vnum: 20003
    name: Логово босса
    description: 'В центре зала стоит огромный каменный трон, окружённый мрачными
      фигурами из темного дерева. Пахнет древесиной и кровью. Звуки приближающихся
      шагов создают атмосферу угрозы.

      '
    examine: 'На стенах висят старые ритуальные книги, покрытые пылью. В углу лежит
      засохший мешок с остатками человеческих костей.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_004
      description: Зал ведет обратно.
    - direction: west
      to_room: room_005
      description: Сокровищница находится рядом.
    - direction: up
      to_room: room_001
      flags:
      - CLOSED
      - QUEST_UNLOCK
      description: Наверх ведет лестница, но она заперта.
  - id: room_007
    vnum: 20001
    name: Вершина башни (секрет)
    description: 'Вы на вершине высокой башни, окутанной туманом. Вокруг видны черные
      обугленные стволы деревьев и зеленая трава. Звуки ветра и шепот из-за кустов
      создают мрачную атмосферу. Пахнет плесенью и древесиной сгоревших деревьев,
      чувствуется тяжелый запах заброшенного поля.

      '
    examine: 'Здесь можно заметить следы старых боевых ловушек и скрытые магические
      травы. Под старым сгоревшим деревом спрятана ритуальная книга местного колдуна,
      которую стоит изучить внимательно.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    exits:
    - direction: down
      to_room: room_002
      description: Вниз ведет лестница, скрытая туманом.
