# Соляные копи - пример зоны для МУД "Былины"
# Автор: система разработки зон
# Версия: 2.0

zone:
  meta:
    id: "salt_mines"
    name: "Соляные копи"
    author: "Zone Development System"
    version: "2.0"
    created: "2026-02-06"
    updated: "2026-02-06"

    description: |
      Древние соляные копи, где когда-то добывали соль для сохранения пищи.
      Теперь соль законсервировала не только мертвых, но и само время.
      Кристаллы соли искрятся в тусклом свете, а в глубине копей слышны
      эхо шагов давно умерших рудокопов.

    folklore_basis: |
      В славянской традиции соль считалась священным оберегом от нечисти - её
      рассыпали на порогах, добавляли в воду для крещения, использовали в
      погребальных обрядах. Существовало поверье, что просыпанная соль приносит
      беду, а соль, побывавшая в доме покойника, может связать душу с миром живых.
      В этих копях древний колдун обратил защитную силу соли в проклятье, превратив
      её в тюрьму для душ рудокопов. Кристаллы соли стали вместилищем для духов,
      законсервировав их между миром живых и мёртвых. По преданиям, души заключённых
      в соль не могут ни упокоиться, ни вернуться к жизни - они обречены вечно
      томиться в прозрачных стенах своей темницы.

    level_min: 10
    level_recommended: 13
    level_max: 15

    # Параметры зоны
    difficulty: 1.0          # Стандартная сложность
    wealth: 1.0              # Стандартное богатство

    tags:
      - underground
      - undead
      - slavic_folklore
      - crystal
      - salt

    entry_points:
      - "salt_001"

  rooms:
    - id: "salt_001"
      vnum: 20001
      name: "Вход в соляные копи"

      description: |
        Широкий проход ведет вглубь горы, в древние соляные копи. Стены покрыты
        толстым слоем белой соли, которая искрится и переливается в тусклом свете,
        проникающем снаружи. Воздух здесь сухой и едко-соленый, першит в горле
        и щиплет глаза. Под ногами с хрустом скрипят мелкие кристаллы соли.
        На стенах видны глубокие следы кирок - свидетельства давно ушедшего труда.
        Тянет холодом из темного прохода, ведущего вглубь.

      examine: |
        Вход обрамлен грубо обтесанными каменными блоками, между которыми
        проросли кристаллы соли. Стены изъедены временем и влагой. Белая
        соляная пыль покрывает все поверхности тонким слоем. Вглубь ведет
        темный проход, откуда тянет холодом.

      sector: "underground"

      flags:
        - "indoors"

      exits:
        - direction: "north"
          to_room: "salt_002"
          description: "Темный проход уходит вглубь копей на север."

        - direction: "south"
          to_room: "world_forest_01"  # Связь с внешним миром
          description: "На юг ведет выход из копей, где виднеется дневной свет."

      atmosphere:
        - message: "Соляная пыль искрится в воздухе, как снежинки."
          chance: 15
        - message: "Холодный ветерок приносит запах древней соли."
          chance: 10
        - message: "Из глубины копей доносится тихий стон ветра."
          chance: 12

    - id: "salt_002"
      vnum: 20002
      name: "Главный коридор"

      description: |
        Широкий коридор тянется на север и юг, погруженный в сумрак. Стены, пол
        и потолок полностью покрыты кристаллами соли - прозрачными, мутно-белыми,
        иногда с желтоватым оттенком. Они искрятся и переливаются, создавая
        причудливую игру тусклого света. Под ногами соль скрипит и хрустит,
        звук отдается гулким эхом. Где-то вдали слышен размеренный звук - то ли
        капающая вода, то ли шаги. Воздух холодный и влажный, на губах ощущается
        соленый привкус пыли.

      examine: |
        Кристаллы образуют причудливые наросты на стенах. Кое-где видны соляные
        сталактиты, свисающие с потолка. В некоторых прозрачных кристаллах можно
        разглядеть застывшие пузырьки воздуха или мелких насекомых.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"

      exits:
        - direction: "north"
          to_room: "salt_003"
          description: "Коридор продолжается на север."

        - direction: "south"
          to_room: "salt_001"
          description: "На юг - обратно ко входу."

        - direction: "west"
          to_room: "salt_005"
          description: "На запад ведет узкий проход между кристаллами."

      mobiles:
        - mobile_id: "salt_mummy"
          max_count: 2
          respawn_time: 300

      atmosphere:
        - message: "Где-то вдали слышен зловещий скрип кристаллов."
          chance: 20
        - message: "Соляная пыль поднимается под ногами, сверкая в тусклом свете."
          chance: 15
        - message: "Эхо твоих шагов множится, создавая ощущение преследования."
          chance: 10

    - id: "salt_003"
      vnum: 20003
      name: "Развилка"

      description: |
        Коридор расширяется, образуя небольшой зал, от которого расходятся три
        прохода. Здесь когда-то была стоянка рудокопов - в углу сложены старые
        деревянные балки, покрытые толстой соляной коркой. Рядом лежит ржавая
        кирка, наполовину вросшая в белый соляной нарост. Стены здесь особенно
        красивы - кристаллы образуют причудливые узоры, напоминающие застывшие
        морские волны. Воздух тяжелый и спертый, пахнет старым деревом и солью.
        Балки тихо поскрипывают под тяжестью потолка, осыпая мелкую белую пыль.

      examine: |
        Деревянные балки почти полностью пропитались солью и превратились в
        хрупкие, белые структуры. На полу видны следы - но не понять, свежие
        ли они, или их тоже законсервировала соль. Ржавчина на кирке смешалась
        с солевыми отложениями, создав причудливый красно-белый узор.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"

      exits:
        - direction: "north"
          to_room: "salt_004"
          description: "Широкий проход ведет на север."

        - direction: "south"
          to_room: "salt_002"
          description: "На юг - обратно по коридору."

        - direction: "east"
          to_room: "salt_007"
          description: "Узкий лаз ведет на восток."

        - direction: "west"
          to_room: "salt_005"
          description: "На запад - через узкий проход."

      objects:
        - object_id: "salt_crystal"
          max_count: 2
          respawn_time: 600

      mobiles:
        - mobile_id: "salt_golem"
          max_count: 1
          respawn_time: 600

      atmosphere:
        - message: "Старые балки скрипят, осыпая соляную пыль."
          chance: 10
        - message: "Кристаллы на стенах отражают твою тень, искажая её."
          chance: 12
        - message: "Тишина здесь такая плотная, что слышно биение собственного сердца."
          chance: 8

    - id: "salt_004"
      vnum: 20004
      name: "Зал соляных статуй"

      description: |
        Просторный зал с высокими сводами, погруженный в гнетущую тишину. Главная
        особенность этого места - десятки соляных статуй, застывших в различных
        позах ужаса. Это не скульптуры, а несчастные, которых поглотила соль.
        Их тела полностью покрыты толстой белой коркой, но под ней угадываются
        человеческие формы. Некоторые застыли в попытке бежать, другие упали на
        колени в последней мольбе. Их безмолвные фигуры создают жуткое зрелище.
        В центре зала возвышается особенно большая статуя - возможно, когда-то
        это был надсмотрщик. Воздух здесь неподвижен и холоден, словно само время
        остановилось. Пахнет смертью и древней солью.

      examine: |
        Приглядевшись, можно различить под соляной коркой черты лиц - застывшие
        выражения ужаса или мольбы. Соль проникла во все складки одежды, все
        щели, создав идеальные слепки. Воздух здесь особенно тяжелый, будто
        сами статуи излучают холод и тоску.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"
        - "silent"

      exits:
        - direction: "north"
          to_room: "salt_006"
          description: "За статуями виднеется проход на север."

        - direction: "south"
          to_room: "salt_003"
          description: "Назад к развилке на юг."

        - direction: "west"
          to_room: "salt_009"
          description: "Узкая трещина в западной стене ведет в небольшую пещеру."

        - direction: "east"
          to_room: "salt_010"
          description: "На востоке виднеется старый проход."

      mobiles:
        - mobile_id: "salt_spirit"
          max_count: 3
          respawn_time: 400

        - mobile_id: "salt_golem"
          max_count: 2
          respawn_time: 500

      objects:
        - object_id: "salt_amulet"
          max_count: 1
          respawn_time: 1800

      atmosphere:
        - message: "Одна из статуй, кажется, повернула голову... Нет, показалось."
          chance: 5
        - message: "В тишине зала слышно твое собственное дыхание."
          chance: 15
        - message: "Соляная пыль медленно опускается с потолка."
          chance: 20

    - id: "salt_005"
      vnum: 20005
      name: "Узкий проход"

      description: |
        Узкий проход между массивными соляными наростами. Стены здесь сходятся
        так близко, что приходится протискиваться боком, ощущая давление камня
        с обеих сторон. Острые кристаллы соли цепляют одежду и царапают кожу,
        оставляя болезненные царапины. Под ногами неровно, легко споткнуться
        о торчащие выступы. Воздух спертый и тяжелый, дышать трудно. Каждый вдох
        обжигает горло соленой пылью. Стены словно давят, вызывая приступ клаустрофобии.

      examine: |
        Кристаллы здесь образовали причудливые формы - острые, как иглы, наросты.
        На некоторых видны темные пятна - возможно, следы старой крови.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"
        - "narrow"

      exits:
        - direction: "east"
          to_room: "salt_002"
          description: "Проход выходит обратно в коридор на востоке."

        - direction: "north"
          to_room: "salt_003"
          description: "Узкий проход ведет на север к развилке."

        - direction: "west"
          to_room: "salt_008"
          description: "Проход продолжается на запад."

      atmosphere:
        - message: "Стены давят своей близостью, вызывая тревогу."
          chance: 15
        - message: "Острые кристаллы звенят при малейшем прикосновении."
          chance: 12
        - message: "Холодные капли воды падают с потолка, оставляя соленый след."
          chance: 10

    - id: "salt_006"
      vnum: 20006
      name: "Сердце копей"

      description: |
        Огромный зал, самое сердце древних копей. Здесь стоит гигантский кристалл
        соли - прозрачный, как черный лед, высотой с двухэтажный дом. Он медленно
        пульсирует слабым зеленоватым свечением, которое заливает весь зал
        мертвенным, болезненным светом. Внутри кристалла отчетливо видны застывшие
        фигуры - десятки людей, навечно заключенных в соляную темницу. Их лица
        искажены немым ужасом, рты раскрыты в беззвучном крике. От кристалла
        исходит пронизывающий холод и ощущение древнего, первобытного зла.
        Воздух вибрирует от магической энергии, волосы встают дыбом. Это источник
        проклятия копей, и от одного взгляда на него сжимается сердце.

      examine: |
        Приближаясь к кристаллу, чувствуешь нарастающий холод. Внутри отчетливо
        видны люди - их тела идеально сохранились в соли. Некоторые словно спят,
        другие застыли в момент агонии. Кристалл медленно пульсирует, будто
        дышит. На его поверхности вырезаны древние руны - проклятие, наложенное
        темным колдуном.

      sector: "underground"

      flags:
        - "indoors"
        - "no_teleport"
        - "no_recall"

      exits:
        - direction: "south"
          to_room: "salt_004"
          description: "Единственный выход - на юг."

      mobiles:
        - mobile_id: "salt_guardian"
          max_count: 1
          respawn_time: 1800

        - mobile_id: "salt_golem"
          max_count: 2
          respawn_time: 600

      objects:
        - object_id: "cursed_crystal_heart"
          max_count: 1
          respawn_time: 3600

      atmosphere:
        - message: "Кристалл пульсирует зеленоватым светом."
          chance: 40
        - message: "Внутри кристалла движутся тени."
          chance: 20
        - message: "Ощущение древнего зла давит на разум."
          chance: 15

    - id: "salt_007"
      vnum: 20007
      name: "Старый лагерь"

      description: |
        Небольшая пещера, которую рудокопы использовали как место отдыха и последнее
        пристанище. Здесь остались следы их жизни: деревянный стол, покрытый толстой
        соляной коркой, пара сломанных стульев, старый потрескавшийся сундук.
        На потемневшей от времени стене вырезаны имена - последняя память о тех,
        кто работал здесь. В углу лежат скелеты двух человек, обнявшихся в
        последнем прощании. Воздух здесь затхлый и тяжелый, пахнет старостью,
        смертью и солью. Тишина давящая, нарушаемая лишь редким осыпанием
        соляной пыли с потолка.

      examine: |
        Имена на стене почти стерлись от времени, но некоторые еще можно
        разобрать: Иван, Петр, Федор... Простые русские имена. Сундук заперт,
        но замок проржавел. Скелеты покрыты соляным налетом - соль сохранила
        даже их последнее объятие.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"

      exits:
        - direction: "west"
          to_room: "salt_003"
          description: "Обратно к развилке на запад."

        - direction: "north"
          to_room: "salt_010"
          description: "Старый проход ведет на север к шахтам."

        - direction: "up"
          to_room: "salt_009"
          description: "Узкий лаз ведет вверх к боковой пещере."

      mobiles:
        - mobile_id: "salt_ghost"
          max_count: 1
          respawn_time: 1800

      objects:
        - object_id: "old_chest"
          max_count: 1
          respawn_time: 7200

        - object_id: "salt_crystal"
          max_count: 3
          respawn_time: 600

      atmosphere:
        - message: "Скелеты безмолвно смотрят пустыми глазницами."
          chance: 10
        - message: "На столе лежит кусок окаменевшего хлеба."
          chance: 5

    - id: "salt_008"
      vnum: 20008
      name: "Соляная трясина"

      description: |
        Здесь пол покрыт странной, отвратительной субстанцией - полурастворенной
        солью, смешанной с подземными водами. Это не совсем жидкость и не совсем
        твердое вещество. Ступая сюда, проваливаешься по щиколотку в липкую,
        мерзкую соленую массу. Двигаться трудно, ноги скользят и вязнут с
        неприятным чавкающим звуком. Воздух здесь влажный, тяжелый и соленый,
        почти осязаемый. Пахнет гнилью и тиной. От трясины поднимаются испарения,
        застилающие всё белесой дымкой.

      examine: |
        Соляная трясина образовалась из-за подземного источника. Вода растворяет
        соль, создавая эту опасную субстанцию. Говорят, что под ней могут быть
        провалы в более глубокие уровни копей. За слоем трясины виднеется скрытый проход.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"
        - "difficult_terrain"

      exits:
        - direction: "east"
          to_room: "salt_005"
          description: "На восток - обратно к узкому проходу."

        - direction: "north"
          to_room: "salt_011"
          description: "Скрытый проход сквозь трясину ведет на север."
          door:
            name: "Скрытый проход"
            flags:
              - "HAS_DOOR"
              - "HIDDEN"

      mobiles:
        - mobile_id: "salt_ooze"
          max_count: 2
          respawn_time: 400

      atmosphere:
        - message: "Соляная жижа хлюпает под ногами."
          chance: 30
        - message: "Что-то шевелится под поверхностью трясины."
          chance: 10

    - id: "salt_009"
      vnum: 20009
      name: "Боковая пещера"

      description: |
        Небольшая пещера, скрытая за узкой трещиной в стене зала статуй. Здесь
        рудокопы когда-то складировали особо ценные находки - крупные кристаллы
        соли редкой чистоты. Сейчас пещера наполовину завалена обломками породы,
        но между ними блестят и переливаются чистые соляные кристаллы невероятной
        красоты. Некоторые достигают размера человеческой головы и светятся
        изнутри мягким белым светом. Воздух здесь заметно чище и легче, чем в
        других частях проклятых копей. Стены покрыты россыпью мелких кристаллов,
        создающих эффект звездного неба.

      examine: |
        Кристаллы здесь особенно крупные и прозрачные. Некоторые достигают
        размера человеческой головы. При движении они издают мелодичный звон.
        В глубине пещеры видны следы обвала - когда-то здесь работали люди.

      sector: "underground"

      flags:
        - "indoors"
        - "dark"

      exits:
        - direction: "east"
          to_room: "salt_004"
          description: "Обратно к залу статуй на восток."

        - direction: "down"
          to_room: "salt_007"
          description: "Узкий лаз ведет вниз к старому лагерю."

        - direction: "south"
          to_room: "salt_010"
          description: "Проход ведет на юг к старым шахтам."

      objects:
        - object_id: "salt_crystal"
          max_count: 5
          respawn_time: 900

      atmosphere:
        - message: "Кристаллы тихо звенят при каждом движении воздуха."
          chance: 25
        - message: "Свет преломляется в кристаллах, создавая радужные блики."
          chance: 15

    - id: "salt_010"
      vnum: 20010
      name: "Старые шахты"

      description: |
