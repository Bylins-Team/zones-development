zone:
  meta:
    id: fortress_of_zmey
    name: Крепость Змея Горыныча
    author: Zone Generator
    version: '1.0'
    description: В глубинах древнерусского леса, среди вековых дубов и туманных болот,
      возвышается неприступная крепость. Известно лишь немногим смельчакам, что эта
      крепость принадлежит могущественному Змею Горынычу.
    recommended_level:
    - 15
    - 18
  lore:
    history: В давние времена, когда древнерусский лес был еще полон тайн и опасностей,
      на берегу реки Камень появилась могучая крепость. Некогда она принадлежала славному
      герой-князю Игорю, который укреплял границы своего державства. Однако после
      его смерти, крепость была захвачена Змеем Горынычем, древним змейом из славянских
      мифов.
    folklore_basis: Большую часть истории этой крепости составляет былина о Герое
      Соловье-Разбойнике. По легенде, он пришел сюда, чтобы разрушить гнездо Змея
      Горыныча и освободить земли от его власти.
    current_state: В настоящее время крепость Змея Горыныча окружена мистической аурой.
      Древние стены пропитаны следами битв, а воздух наполнен враждебностью и страхом.
      Кто осмелится вторгнуться сюда?
    conflict: Соловей-Разбойник отправился на поиски крепости Змея Горыныча для того,
      чтобы разрушить ее и вернуть покой землям. Игроки должны присоединиться к нему
      в его опасном приключении.
    key_characters:
    - name: Соловей-Разбойник
      role: Главный герой былины, борец со Змеем Горынычем.
      description: Молодой и отважный воин с серебристым плащом.
    - name: Змий Горынёк
      role: Нечестивый владелец крепости, противник Соловья-Разбойника.
      description: Триголовый змей со страшными глазами и ужасающей силой.
    - name: Старец Василий
      role: Мудрый житель деревни рядом с крепостью, знающий многое о ней.
      description: Седобородый старик со светлым взглядом и мудрыми словами.
    atmosphere:
      sounds:
      - Шорох крыльев пролетающих по ночному небу птиц
      - Гул тихого пламени в очагах
      smells:
      - Влажность камня и древесного дыма
      - Запах старой ржавчины с оружия
      visuals:
      - Туманный лес, окружающий крепость
      - Каменные стены с надписями на славянском языке
      feeling: Место пропитано древностью и магией. Каждый камень здесь хранит свою
        историю.
    secrets:
    - Тайное место, где Соловей-Разбойник встречается с другими героями для планирования
      нападения на крепость.
    - Скрытая тропа ведущая в подземелье с древними реликвиями.
  rooms:
  - vnum: 20001
    name: Темный вход
    description: 'Темный коридор приветствует вас холодом и тьмой. Шорох крыльев летящих
      птиц доносится издалека, а запах древесного дыма смешивается с влажностью камня.
      На стенах видны следы битв - царапины от мечей и стрел.

      '
    examine: 'В стене заметно углубление для факела или свечи, рядом лежит сломанный
      металлический крюк.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    id: room_001
    exits:
