zone:
  meta:
    id: zone_russian_winter_forest
    name: Зимний лес Велеса
    author: Zone Generator
    version: '1.0'
    description: Среди снежных бурь и туманов скрывается древний лес, покровительствуемый
      славянским богом Велесом. Здесь обитают духи природы, а в глубине ждет испытание
      для тех, кто готов рискнуть.
    recommended_level:
    - 8
    - 12
  lore:
    history: В давние времена, в глубинах леса, где встречались тропы древних путников,
      стояла деревня Ярильск, посвященная богу Яриле. В те времена зимний ритуал Ярилы
      был важнейшим событием года, приносящим тепло и плодородие после суровой зимы.
      Однако вскоре после одного из таких празднеств деревня исчезла в снежной буре,
      а ее место занял лес Велеса.
    folklore_basis: Славянский ритуал Ярилы, посвященный богу зимы и весны. Согласно
      поверьям, после праздника Ярилы люди должны были соблюдать особые правила, чтобы
      избежать злых духов и нечисти. Велес считается покровителем путников и путешествий,
      его помощь нужна тем, кто отправляется в опасное предприятие.
    current_state: Теперь лес Велеса притягивает к себе путников со всех сторон. Здесь
      обитают духи-привидения и зимние сущности, которые появляются после праздника
      Ярилы. Местные жители боятся заходить в этот лес и рассказывают истории о том,
      как там можно встретить заблудшие души.
    conflict: Среди этих опасностей находится древнее ритуальное снаряжение, необходимое
      для проведения праздника Ярилы. Без него зима может стать бесконечной и суровой,
      а весна никогда не наступит. Игрокам предстоит найти это снаряжение, чтобы вернуть
      равновесие в лесу.
    key_characters:
    - name: Князь Святослав
      role: Призыватель к празднику Ярилы
      description: Видимый лишь избранным, князь призывает путешественников помочь
        в ритуале. Он дает ключевые указания и задания.
    - name: Святогор
      role: Охотник на зимних дух-привидений
      description: Бывший воин, который теперь охотится за духами из леса Велеса.
        Предоставляет советы и помощь тем, кто готов к битве.
    atmosphere:
      sounds:
      - Шорох снега под ногами
      - Ветер шепчет сквозь ветви
      smells:
      - Холодный воздух лесной зимы
      - Запах древнего пламени из заброшенных очагов
      visuals:
      - Свечение магических источников, освещающих тропинки
      - Туман, скрывающий дальнюю перспективу
      feeling: Ощущение опасности и одиночества в суровой зимней тишине
    secrets:
    - Скрытая пещера с древним озером, где духи-привидения проявляются особенно сильно.
    - Заброшенный храм Ярилы, в котором можно найти ритуальное снаряжение.
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Темная пещера с холодными каменными стенами. Шорох снега под ногами,
      ветер шепчет сквозь ветви.

      Холодный воздух лесной зимы, запах древнего пламени из заброшенных очагов. Ощущение
      опасности и одиночества.

      '
    examine: 'Вход тонкой трещиной прорезает стену пещеры. Стены покрыты снежными
      наслоениями, а в глубине виднеется свет магических источников.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
    - direction: down
      to_room: room_003
    - direction: south
      to_room: world_forest_01
  - id: room_002
    vnum: 20002
    name: Башня стража
    description: 'Высокая башня с тусклыми окнами и старыми доспехами. Шорох ветра,
      который проходит сквозь щели.

      Холодный воздух лесной зимы, запах древнего пламени из заброшенных очагов. Ощущение
      опасности и одиночества.

      '
    examine: 'Башня выглядит заброшенной, но в одном углу виден старый фонарь с тлеющим
      факелом.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_001
    - direction: up
      to_room: room_007
    - direction: east
      to_room: room_004
      flags:
      - HIDDEN
  - id: room_003
    vnum: 20003
    name: Подземный коридор
    description: 'Узкий подземный коридор с мокрыми каменными стенами. Шорох воды
      по камням, эхо шагов.

      Холодный воздух лесной зимы, запах сырости и плесени. Ощущение опасности и одиночества.

      '
    examine: 'На стенах видны следы древних наскальных рисунков и надписей на старославянском
      языке.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: up
      to_room: room_001
    - direction: north
      to_room: room_004
    - direction: east
      to_room: room_005
  - id: room_004
    vnum: 20001
    name: Зал с ловушками
    description: 'Зал темный и холодный, пол покрыт толстым слоем пыли. Стены украшены
      древними рунами и узорами, но видно, что они повреждены временем. Воздух наполнен
      металлическим запахом старого железа и гниющей древесины. Шорох снега слышится
      издалека, словно кто-то бродит по лесу за пределами зала.

      '
    examine: 'В углу заметна ржавая ловушка на цепях, готовая к действию при малейшем
      движении. Узоры на стенах кажутся знакомыми, возможно, это древние символы защиты
      от нечисти. Здесь можно увидеть следы битвы: поврежденные щиты и мечи.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    exits:
    - direction: south
      to_room: room_003
    - direction: north
      to_room: room_006
    - direction: west
      to_room: room_002
      flags:
      - HIDDEN
  - id: room_005
    vnum: 20002
    name: Сокровищница
    description: 'Зал наполнен свечами и факелами, отражающими мягкий свет с монетами
      и драгоценностями на полу. Стены украшены старыми портретами богатых людей прошлого
      времени. Воздух здесь пропитан ароматом благовоний и сладким запахом меда. Шепот
      ветра доносится издалека, словно кто-то наблюдает за каждым шагом.

      '
    examine: 'На стенах видны тайники с древними монетами и драгоценностями. Среди
      них можно найти редкие артефакты, которые могут быть полезными в битве против
      нечисти. Здесь также заметен запечатанный сундук с надписью на древнем языке.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_003
    - direction: north
      to_room: room_006
  - id: room_006
    vnum: 20003
    name: Логово босса
    description: 'Зал огромен и наполнен мрачной атмосферой. Пол покрыт костями и
      старыми доспехами, стены украшены рунами и таинственными символами. Воздух здесь
      пропитан запахом крови и смерти. Шум битвы доносится издалека, словно кто-то
      уже вступил в бой.

      '
    examine: 'Здесь можно увидеть огромные камни со старыми рунами, которые кажутся
      знаками защиты от нечисти. В углу заметен заброшенный алтарь с остатками зажженных
      свечей и дымящихся благовоний. Среди костей можно найти древние артефакты.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_004
    - direction: west
      to_room: room_005
    - direction: up
      to_room: room_001
      flags:
      - CLOSED
      - QUEST_UNLOCK
  - id: room_007
    vnum: 20014
    name: Вершина башни (секрет)
    description: 'Вы на вершине древней башни, где воздух холоден и пронизан ветром.
      Вокруг лишь бескрайние леса и снежные холмы.

      Слышны далекие шепоты ветра, а запах древнего камня смешивается со свежим снегом.

      '
    examine: 'Здесь виднеются следы недавней битвы. На полу лежат обломки магических
      артефактов и оружие старых времен.

      В центре комнаты укреплена ступенька, ведущая к более глубоким уровням.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: down
      to_room: room_002
  - id: room_008
    vnum: 20015
    name: Подземный туннель
    description: 'Вы находитесь в узком подземном туннеле, освещенном лишь слабым
      светом издалека. Путь идет к югу и северу.

      Воздух здесь холодный и сыроватый, а звуки эхом отдаются от каменных стен.

      '
    examine: 'Стены туннеля покрыты древними рисунками и надписями. Кое-где видны
      следы магии в виде светящихся узоров.

      Запах сырости смешивается с ароматом земли.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: south
      to_room: room_003
    - direction: north
      to_room: room_009
  - id: room_009
    vnum: 20016
    name: Зал с ритуалами
    description: 'Вы попали в большой подземный зал, где когда-то проводились магические
      ритуалы. Воздух здесь пропитан древней энергией.

      Шепот ветра и эхо шагов заполняют пространство, а запахи прошлого смешиваются
      с теплым светом от близлежащего источника.

      '
    examine: 'В центре зала виднеется старый алтарь с остатками ритуальных предметов.
      На стенах заметны древние символы и заклинания.

      Стены покрыты мхом, а пол скользкий от влаги.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_008
    - direction: east
      to_room: room_010
  - id: room_010
    vnum: 20001
    name: Подземный лабиринт
    description: 'Темные коридоры уходят вглубь, скрывающиеся за каждым поворотом.
      Шорох снега под ногами и эхо шагов наполняют воздух. Холодный зимний запах проникает
      издалека. Стены покрыты мхом и плесенью, ткань времени ощущается на каждом камне.

      '
    examine: 'На стенах видны древние наскальные рисунки и символы Ярилы. Вдоль коридоров
      разбросаны обломки старых ловушек. Несколько тайников с пустыми ящиками указывают
      на то, что здесь когда-то хранились ценные предметы.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_009
    - direction: north
      to_room: room_011
  - id: room_011
    vnum: 20002
    name: Подземное хранилище
    description: 'Помещение с высокими сводами, облицованными камнем. В центре — старый
      деревянный стол и несколько пустых ящиков. Шорох снега доносится издалека, ветер
      шепчет сквозь щели в стенах. Запах древнего пламени напоминает о былых временах.

      '
    examine: 'На столе лежит старая книга с рисунками ритуальных предметов Ярилы.
      В углу заметно следы от ловушки, которая когда-то здесь стояла.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_010
    - direction: east
      to_room: room_012
  - id: room_012
    vnum: 20003
    name: Подземный лабиринт
    description: 'Коридоры извилиста и узки, ведут к неизвестным глубинам. Шорох снега
      под ногами и тихий шепот ветра наполняют воздух. Запах древнего пламени и мха
      проникает во все углы. Стены покрыты мхом, камни скользкие от сырости.

      '
    examine: 'Вдоль стен видны следы от древних ловушек и тайники с пустыми ящиками.
      Каменные стены украшены наскальными рисунками Ярилы и Велеса.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_011
    - direction: north
      to_room: room_013
  - id: room_013
    vnum: 20051
    name: Подземный хранилище
    description: 'Темные стены подземного хранилища отражают слабый свет факела. Здесь
      хранятся древние сокровища и ритуальные предметы. Шорох снега доносится издалека,
      хотя в этой глубине леса он не должен быть слышен. Воздух холодный и сырой,
      пахнет древним пламенем и магией.

      '
    examine: 'На стенах видны следы бывших владельцев, а также старые надписи на древнерусском
      языке. Здесь можно найти ритуальное снаряжение для праздника Ярилы.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_012
    - direction: east
      to_room: room_014
  - id: room_014
    vnum: 20052
    name: Подземный лабиринт
    description: 'Лабиринтные коридоры тянутся во все стороны, создавая ощущение бесконечности.
      Шорох снега под ногами усиливается в этой глубине. Воздух холодный и сыроватый,
      пахнет древним пламенем из заброшенных очагов. Туман скрывает дальнюю перспективу.

      '
    examine: 'В некоторых местах видны следы борьбы с зимними духами-привидениями.
      Здесь можно найти ритуальное снаряжение для праздника Ярилы, но также стоит
      быть осторожным - ловушки и секретные проходы встречаются часто.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_013
    - direction: north
      to_room: room_006
