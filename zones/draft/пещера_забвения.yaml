zone:
  meta:
    id: zone_peshchera_zabvushennaja
    name: Пещера забвения
    author: Zone Generator
    version: '1.0'
    description: Глубоко под землёй, в недрах камня, лежит Пещера Забвения, где души
      умерших скитаются, пытаясь найти покой. Здесь они сталкиваются с духами забвения
      и прочими нечистыми силами.
    recommended_level:
    - 10
    - 12
  lore:
    history: Недалеко от древнего русского города Славин, в глубинах земли, существовала
      священная пещера, известная местным жителям как Пещера Забвения. Когда-то здесь
      проводили ритуалы и молитвы древние славяне для помощи душам умерших найти покой
      в загробном мире. Однако с течением времени, из-за забвения и нарушения этих
      обычаев, пещера стала местом, где скитаются заблудшие души, призывая к себе
      всё больше нечисти.
    folklore_basis: Поверья связаны с загробным миром славян, а также былинами о богатырях,
      которые иногда вступали в битву со силами тьмы. В частности, упоминается жрец-хранитель
      пещеры Забвения, который защищал её от нечисти и помогал душам умерших.
    current_state: В наши дни Пещера Забвения полна опасностей и тайн. Здесь обитают
      духи забвения, которые пытаются затеряться в темноте и омрачить свет загробного
      мира. Неподготовленный путник может оказаться пленником этих духов.
    conflict: Игрокам предстоит спасти заблудшие души от вечных мучений, освободив
      их от власти духов забвения и возвращая к свету загробного мира. Только сильные
      и смелые могут противостоять этим тёмным силам.
    key_characters:
    - name: Старый Жрец
      role: Хранитель Пещеры Забвения
      description: Жрец старого закала, который знает все секреты пещеры и способен
        помочь игрокам в их миссии. Однако его силы ослабли из-за длительного противостояния
        с нечистью.
    - name: Проклятый Дух Забвения
      role: Главный враг
      description: Сильный дух, который захватил пещеру и теперь держит там заблудшие
        души. Имеет способность становиться невидимым и заманивать путников глубже
        в темноту.
    - name: Упавшая Княжна
      role: Пленник Духа Забвения
      description: Княжна, которая погибла в молодом возрасте и не смогла найти покой.
        Она может помочь игрокам с местными секретами, если они помогут ей освободиться.
    atmosphere:
      sounds:
      - Шёпот невидимых теней
      - Тихий плеск подземных потоков
      smells:
      - Влажная сырость и запах гниющей древесины
      - Кислый аромат старого мха
      visuals:
      - Светящиеся глаза невидимых духов в темноте
      - Стены украшенные странными рунами, словно оставленными там вековыми жрецами
      feeling: Тяжёлое и мрачное место, полное опасности и тайн. Каждый шаг может
        быть последним.
    secrets:
    - Секретный проход к загробному миру
    - Забытые артефакты древних магов для борьбы с нечистью
  rooms:
  - vnum: 20001
    name: Темный вход
    description: 'Темный проход ведет глубоко под землю. Стены покрыты мхом и лишайниками,
      из-за которых пахнет сырость. Вдали слышится шепот невидимых теней.

      '
    examine: 'На стенах видны древние руны, вырезанные когда-то жрецами. Местные говорят,
      что это вход в Пещеру Забвения.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    id: room_001
    exits:
    - direction: north
      to_room: room_002
    - direction: down
      to_room: room_003
    - direction: south
