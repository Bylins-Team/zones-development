    description: 'Узкий коридор изрытый временем, стены покрыты мхом и заплеваны.
      Вдалеке слышится тихий плеск подземных потоков.

      '
    examine: 'На стене виден забытый проход, ведущий к загробному миру. Слева от него
      древние руны предупреждают о близости опасности.

      '
    sector: UNDERGROUND
    flags:
