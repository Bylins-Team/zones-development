  - vnum: 20002
    name: Сокровищница
    description: 'Зал наполнен старыми сундуками и мешками со снаряжением. На стенах
      висят раритеты древних воинов.

      Тихий плеск подземных потоков доносится издалека, а запах гниющей древесины
      наполняет воздух.

      '
    examine: 'Среди сундуков можно найти полезные предметы и артефакты. Здесь также
      заметны следы недавнего присутствия.

      В углу лежит старая кость, возможно, принадлежащая некогда могучему богатырю.

      '
