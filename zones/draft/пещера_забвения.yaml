  - vnum: 20001
    name: Зал с ловушками
    description: 'Зал усеян древними механизмами и ловушками. Стены украшены рунами,
      из которых порой веет холодом.

      Шёпот невидимых теней заполняет пространство, а под ногами скрипят старые доски.

      '
    examine: 'Ловушки кажутся древними и сложными. Здесь можно найти забытые ключи
      или инструменты для их обезвреживания.

      На стенах видны следы битвы с нечистью, свидетельствующие о прошлых посещениях.

      '
