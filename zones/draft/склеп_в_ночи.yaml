zone:
  meta:
    id: sklepin_nochi
    name: Склеп в Ночи
    author: Zone Generator
    version: '1.0'
    description: Маленький склеп, заброшенный веками под лесом. Его каменные стены
      испещрены надписями и рунами, а воздух пропитан мрачным прохладным запахом нежити.
    recommended_level:
    - 10
    - 12
  lore:
    history: 'Склеп в Ночи был когда-то построен древними жрецами для хранения тел
      умерших воинов, чтобы их духи могли сохранить защиту над родной землей. Время
      сменило владельцев этого места: сначала оно стало местом погребения простых
      людей, а затем забросили и покинули его. Многие из тех, кто здесь похоронен,
      превратились в духи, которые теперь бродят вокруг склепа.'
    folklore_basis: Склеп связан с поверьями о домовых и нечистой силе. Считается,
      что души умерших воинов и простых людей могут вернуться из загробного мира при
      определенных обстоятельствах и требовать поклонения или жертвы.
    current_state: Сегодня склеп заселен духами умерших славянских воинов и простых
      людей. Они бродят по каменным коридорам, тихо выкрикивая древние заклинания
      на стенах склепа. Многие из этих духов становятся враждебными к пришельцам.
    conflict: Основной конфликт связан с тем, что духи умерших требуют жертвы и поклонения,
      чтобы они могли оставаться в мире живых. Игроки должны помочь усмирить нежить
      или найти способ вернуть ее в мир загробный.
    key_characters:
    - name: Святослав
      role: Заклятый воин, бродящий по склепу.
      description: Бывший воин, который был схоронен здесь и теперь призраком требует
        жертвы.
    - name: Вида Светлая
      role: Дух умершей женщины, помогающая тем, кто может разгадать тайну алтаря.
      description: Женщина по имени Вида была зарыта в этом склепе и теперь призраком
        пытается помочь игрокам найти древние артефакты на алтаре.
    atmosphere:
      sounds:
      - Тихий шепот прошлых поколений
      - Звуки тонкого ветра, пробирающегося через щели
      smells:
      - Почва и древесина, пропитанная веками мокростию
      - Свежие цветы на алтаре как символ мира
      visuals:
      - Каменные стены с рунами и надписями
      - Маленький светящийся отверстие в крыше, пропускающее лунный свет
      feeling: Склеп наполняет холодом и мраком, но также теплым чувством помощи призрачных
        существ.
    secrets:
    - На алтаре спрятан древний камень силы, доступ к которому дает знание старого
      заклинания.
    - В глубине склепа есть тайный проход в подземелье, где обитают более могущественные
      духи.
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Темный коридор ведет внутрь склепа. Каменные стены покрыты мхом
      и плесенью, а воздух наполнен сыростью и запахом древности. Тихий шепот прошлых
      поколений доносится из темноты.

      '
    examine: 'В коридоре видны следы древних рун на стенах и тусклый свет от маленького
      отверстия в крыше, пропускающего лунный свет. Здесь можно услышать приглушенные
      голоса умерших.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
    - direction: down
      to_room: room_003
    - direction: south
