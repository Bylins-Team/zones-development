zone:
  meta:
    id: zone_tsyganov_livnya
    name: Тайная деревня Тсюганова
    author: Zone Generator
    version: '1.0'
    description: Маленькая тихая деревушка, страдающая от наводнений и проклятия нечистой
      силы. Здесь жители ведут скрытный образ жизни, опасаясь пришествия водной нечисти.
    recommended_level:
    - 5
    - 10
  lore:
    history: Долгое время деревня Тсюганова стояла на высоком берегу реки, процветая
      за счет рыбного промысла. Однако в те дни, когда злобная баба Яга поставила
      на деревню чары, наводнения стали происходить каждый год. Люди начали покидать
      свои дома, а оставшиеся жители обратились к древним магическим традициям для
      защиты.
    folklore_basis: Фольклорные истории о водяных и бабе Яге, которые часто используют
      вода и наводнения как средство отомстить людям. Поверья о том, что мертвые могут
      восставать из воды после наводнений.
    current_state: Теперь деревня Тсюганова погружена во тьму и страх. Жители живут
      в подвалах и катакомбах, опасаясь нечистой силы, что выходит с реки во время
      наводнений.
    conflict: Жителям деревни нужна помощь для разрушения проклятия бабы Яги и освобождения
      их от водной нечисти. Игрокам предстоит помочь им в этом, исследуя древние ритуалы
      и преодолевая загадки.
    key_characters:
    - name: Иван Тсюганов
      role: Последний деревенский староста
      description: Старый мужик, который помнит традиции защиты от наводнений и знает
        о древних ритуалах.
    - name: Матрена Невестка
      role: Жрица воды, изгоняющая нечисть
      description: Несущая свет в темное время деревни. Она обучает игроков магии
        водной стихии и помогает справляться с духами реки.
    atmosphere:
      sounds:
      - Шум воды под наводнением
      - Плач жителей, боящихся за свои жизни
      smells:
      - Запах сырой земли и тины от наводненной реки
      - Гнилостный запах мертвых тел
      visuals:
      - Тусклые факелы в подвалах деревни, освещающие только крохотные участки
      - Вода, переполняющая улицы и дома
      feeling: Общее ощущение места – тьма и страх. Каждое место напоминает о том,
        что наводнения близко.
    secrets:
    - Заброшенная церковь с древними ритуалами против водной нечисти
    - Подземный ход к реке, где можно найти духа воды для переговоров.
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Узкий проход, освещенный лишь тусклым светом факела. Вода капает
      с потолка и собирается на полу.

      Шум воды слышится отовсюду, плач жителей доносится издалека.

      Запах сырой земли и гнилостный запах мертвых тел витают в воздухе.

      '
    examine: "На стенах видны следы воды и ржавые цепи, возможно использованные для\
      \ затворов. \nСтены украшены древними символами против водной нечисти.\n"
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
      description: Башня стража.
    - direction: down
      to_room: room_003
      description: Подземный коридор.
    - direction: south
      to_room: world_forest_01
      description: Вход в лес.
  - id: room_002
    vnum: 20002
    name: Башня стража
    description: "Высокая башня с единственным окном, через которое видны туманы над\
      \ рекой. \nВнутри стоит старый стол и несколько факелов на стенах.\nШум воды\
      \ и плач жителей слышатся отовсюду.\n"
    examine: 'На стене висит древний меч, возможно использованный для защиты деревни.

      Надпись на стене указывает на подъемный механизм в башне.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_001
      description: Темный вход.
    - direction: up
      to_room: room_007
      description: Призрачные уровни башни.
    - direction: east
      to_room: room_004
      flags:
      - HIDDEN
      description: Скрытый проход.
  - id: room_003
    vnum: 20003
    name: Подземный коридор
    description: "Темный подземный коридор с мокрыми стенами и сводчатым потолком.\n\
      Вода капает из щелей, собравшись в лужи на полу. \nЗапах сырой земли и гнилостного\
      \ запаха трупов преследует вас.\n"
    examine: 'На стенах видны следы древних ритуалов против водной нечисти.

      Стены украшены символами, предупреждающими о близости опасности.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: up
      to_room: room_001
      description: Темный вход.
    - direction: north
      to_room: room_004
      description: Подземная пещера с боссом.
    - direction: east
      to_room: room_005
      description: Комната с сокровищами.
  - id: room_004
    vnum: 20001
    name: Зал с ловушками
    description: 'Замкнутый туннель, освещенный лишь слабыми факелами. Воздух наполнен
      запахом пыли и ржавчины. На стенах видны следы старых ловушек — колючие проволоки
      и расставленные капканы. Шум воды доносится издалека, а эхо шагов усиливает
      ощущение опасности.

      '
    examine: 'В углу заметен сломанный механизм ловушки, словно кто-то недавно здесь
      побывал и попытался его обезвредить. На стенах видны древние надписи — предупреждения
      о тайных путях.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    exits:
    - direction: south
      to_room: room_003
      description: Темный коридор ведет к следующей комнате.
    - direction: north
      to_room: room_006
      description: Зловещий проход, освещенный лишь тусклыми факелами, ведет дальше.
    - direction: west
      to_room: room_002
      flags:
      - HIDDEN
      description: Скрытая дверь ведет к башне стража.
  - id: room_005
    vnum: 20002
    name: Сокровищница
    description: 'Темная зала с высокими сводами, освещенная лишь несколькими факелами.
      Воздух здесь тяжёлый и влажный от сырости. На стенах видны следы древних символов
      — защитных рун и заклинаний. Звуки воды доносятся издалека.

      '
    examine: 'В углу заметен старинный сундук, покрытый пылью и паутиной. На стене
      висит древний меч — возможно, ключ к решению одной из загадок.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_003
      description: Короткий коридор ведет к подземному туннелю.
    - direction: north
      to_room: room_006
      description: Узкий проход, освещенный факелами, ведет дальше.
  - id: room_006
    vnum: 20003
    name: Логово босса
    description: 'Темная пещера с высокими сводами и тусклым освещением от факелов.
      Воздух здесь наполнен запахом сырости и древности. На стенах видны следы старых
      ритуалов — защитных заклинаний и символов. Звуки воды доносятся издалека, а
      эхо шагов усиливает ощущение опасности.

      '
    examine: 'В центре зала заметен древний алтарь с символами водной стихии. Возможно,
      здесь можно найти ключ к разрушению проклятия бабы Яги.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_004
      description: Темный проход ведет к залу с ловушками.
    - direction: west
      to_room: room_005
      description: Узкий коридор ведет к сокровищнице.
    - direction: up
      to_room: room_001
      flags:
      - CLOSED
      - QUEST_UNLOCK
      description: Тяжёлая дверь, открывающаяся только после выполнения задания.
  - id: room_007
    vnum: 20013
    name: Вершина башни (секрет)
    description: 'Верхняя часть высокой башни, где воздух холоднее и тише. Вокруг
      лишь мрачные облака да слабый свет факела на стене. Звуки ветра проникают через
      щели.

      Запах сырости и древесины наполняет пространство, а стены покрыты плесенью.

      '
    examine: 'На полу лежит старая книга с рунами, возможно, ключ к разгадке тайны
      деревни. В углу виднеется небольшой шкаф с древними предметами.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: down
      to_room: room_002
      description: Лестница ведет вниз к башне стража.
  - id: room_008
    vnum: 20014
    name: Подземный тупик
    description: 'Узкий коридор, заканчивающийся перед каменной стеной. Вода капает
      с потолка и собирается в лужи на полу.

      Шум воды заполняет пространство, а от стены исходит холодный туман.

      '
    examine: 'На стене заметен древний рисунок, изображающий водяного. Возможно, это
      подсказка для ритуала против нечисти реки.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: north
      to_room: room_003
      description: Узкий коридор ведет дальше.
  - id: room_009
    vnum: 20015
    name: Камера ловушек
    description: 'Закрытая камера с ржавыми цепями и грубо сколоченными дверьми. Воздух
      здесь тяжелый, как будто давит на плечи.

      Едкий запах ржавчины и древесины проникает в нос.

      '
    examine: 'На стене видна выемка для ключа, возможно, ловушка была частью системы
      защиты деревни от нечистой силы. В углу заметен старый кнут с обрывками веревок.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    exits:
    - direction: south
      to_room: room_004
      description: Камера ведет к другим помещениям.
  - id: room_010
    vnum: 20010
    name: Подземный склад
    description: 'Тесные каменные стены, покрытые плесенью и паутиной. Вода капает
      с потолка на мокрый пол.

      Шум воды издалека напоминает приближение наводнения.

      '
    examine: 'Здесь лежат старые бочки и корзины, забытые временем. На стенах видны
      древние рисунки с защитными заклинаниями.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_005
      description: Узкий проход ведет на север.
  - id: room_011
    vnum: 20011
    name: Подземный туннель
    description: 'Низкие сводчатые потолки и сырой воздух. Вода медленно стекает по
      стенам.

      Плач жителей слышится издалека, словно крик о помощи.

      '
    examine: 'На стенах видны следы от ладоней, как будто кто-то пытался выбраться
      на поверхность. В углу заметна старая железная цепь.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_006
      description: Туннель ведет на юг.
  - id: room_012
    vnum: 20012
    name: Подземный ход
    description: 'Узкий проход с мокрыми камнями под ногами. Вода капает со сводов,
      создавая ледяной ветер.

      Звуки воды и шорох крыльев летучих мышей заполняют пространство.

      '
    examine: 'Здесь можно заметить следы древних ритуалов - мелкие камни и кости у
      входа. В глубине хода слышны странные голоса.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: north
      to_room: room_007
      description: Узкий ход ведет на север.
  - id: room_013
    vnum: 20501
    name: Подземный проход
    description: 'Тусклый свет факела освещает сырой каменный коридор. Вода капает
      с потолка, образуя лужи на полу.

      Звуки течения реки слышны вдалеке, смешивающиеся со звуками плача жителей деревни.

      Стены покрыты мхом и плесенью, придавая проходу запах сырой земли и гнилых водорослей.

      '
    examine: 'На стенах видны древние рисунки, изображающие заклинания против водной
      нечисти.

      Каменные плиты скользкие от воды, но на некоторых можно заметить следы старинных
      надписей.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_008
      description: Продолжение темного коридора.
  - id: room_014
    vnum: 20502
    name: Подземный проход
    description: 'Узкий каменный проход, освещаемый тусклыми факелами. Вода струится
      по стенам и полу.

      Слышны приглушенные голоса жителей деревни, боящихся за свои жизни. Шум воды
      под наводнением усиливается.

      Запах гниющих водорослей и сырой земли проникает в каждый уголок.

      '
    examine: 'На стенах видны следы древних ритуалов, изображающие защитные символы
      против водной нечисти.

      Пол скользкий от воды, но на некоторых местах можно заметить старые надписи
      и рисунки.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: north
      to_room: room_009
      description: Продолжение узкого коридора.
  - id: room_015
    vnum: 20503
    name: Подземный проход
    description: 'Темный каменный проход, освещаемый тусклыми факелами. Вода капает
      с потолка и стекает по стенам.

      Слышны приглушенные голоса жителей деревни, боящихся за свои жизни. Шум воды
      под наводнением усиливается.

      Запах гниющих водорослей и сырой земли проникает в каждый уголок.

      '
    examine: 'На стенах видны следы древних ритуалов, изображающие защитные символы
      против водной нечисти.

      Пол скользкий от воды, но на некоторых местах можно заметить старые надписи
      и рисунки.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_010
      description: Продолжение темного коридора.
