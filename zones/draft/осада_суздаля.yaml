zone:
  meta:
    id: suzdal_siege
    name: Осада Суздаля
    author: Zone Generator
    version: '1.0'
    description: Зона, основанная на легендах о древнерусских осадах и защите родного
      города. Игроки оказывают помощь защитникам Суздаля против вражеского нашествия.
    recommended_level:
    - 13
    - 18
  lore:
    history: Долгое время Суздаль был тихим городком на северо-востоке Руси, известным
      своими ремесленниками и торговцами. Однако век назад город был атакован врагом
      из степей, что привело к кровопролитной обороне, о которой до сих пор рассказывают
      легенды. С тех пор Суздаль стал символом мужества и стойкости русских защитников.
    folklore_basis: Легенда гласит, что во время осады на помощь городу пришли не
      только люди, но и духи лесов и рек. Говорят, что домовые помогали ремонтировать
      стены, а русалки предупреждали о подходе врага через каналы. Существует поверье,
      что лишь те, кто чисты душой и сильны сердцем, могут присоединиться к обороне.
    current_state: 'Суздаль снова стоит под угрозой: городские стены испещрены трещинами
      от предыдущих осад. Защитники ожидают нового нашествия и готовятся бороться
      с помощью старых традиций и новых союзников.'
    conflict: Враги, поддерживаемые магическими силами зла, вновь приближаются к Суздали.
      Защитники города нуждаются в помощи бойцов доказать свою верность Родине и предотвратить
      падение города.
    key_characters:
    - name: Великий стражник Иван
      role: Главный военачальник защитников Суздаля
      description: Старый герой, с мечом в руке и гордым взглядом. Он руководит обороной
        города и обучает новобранцев.
    - name: Домовой Гришка
      role: Союзник защитников
      description: Маленький дух леса, помогающий ремонтировать стены и предупреждать
        о враге. Он знает каждый закоулок города.
    - name: Русалка Анна
      role: Прорицательница
      description: Сказочная дева, живущая в канале Суздаля. Она предсказывает будущее
        и дает советы защитникам о том, как противостоять приближающейся опасности.
    atmosphere:
      sounds:
      - Звуки боевых барабанов
      - Треск стрел из луков
      smells:
      - Паленый порох и дым костров
      visuals:
      - Стены города, испещренные трещинами от прошлых осад
      - Каналы с темными водами
      feeling: Общее ощущение напряжения и угрозы, смешанное с надеждой на победу
        и защиту Родины
    secrets:
    - Сокровища старого князя спрятаны в подземных ходах города
    - Волшебный амулет силы, созданный древним магом, находится у Великого стражника
      Ивана
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Тусклый коридор, испещренный трещинами от давнего боя. Стены покрыты
      мхом и плесенью. Вдали слышны боевые барабаны. Пахнет сыростью и паленой древесиной.

      '
    examine: 'На стенах видны старые надписи защитников, предупреждающие о враге.
      Здесь можно разглядеть следы битвы: латники, упавшие на пол сражаясь до последнего
      вздоха.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
      description: Темный проход ведет к башне стража.
    - direction: down
      to_room: room_003
      description: Узкий ход погружает вас под землю.
    - direction: south
      to_room: world_forest_01
      description: Выйти на улицу и оказаться в лесу.
  - id: room_002
    vnum: 20002
    name: Башня стража
    description: 'Высокая башня с круглыми окнами, пропитанная историей. Внутри темно
      и прохладно. Стены покрыты древними рунами и символами защиты. Звук барабана
      вдали.

      '
    examine: 'На стене видна старая карта города с пометками о предыдущих осадах.
      Здесь можно заметить следы магических ритуалов, направленных на защиту Суздаля.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_001
      description: Выйти из башни обратно в коридор.
    - direction: up
      to_room: room_007
      description: Подняться на верхнюю площадку башни.
  - id: room_003
    vnum: 20003
    name: Подземный коридор
    description: 'Темный, узкий туннель с сырыми стенами. Воздух здесь холоден и влажен.
      Из глубины доносится слабый шепот воды. Запах сырой земли.

      '
    examine: 'На стенах видны старые рисунки, изображающие защитников города во время
      предыдущей осады. Здесь можно найти следы древних подземных ходов.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: up
      to_room: room_001
      description: Выйти обратно в коридор.
    - direction: north
      to_room: room_004
      description: Продолжить путь к тайне.
    - direction: east
      to_room: room_005
      flags:
      - HIDDEN
      description: Скрытый ход ведет на восток.
  - id: room_004
    vnum: 20001
    name: Зал с ловушками
    description: 'Темный и узкий коридор, испещренный трещинами от времени. Треск
      под ногами при каждом шаге. Воздух наполнен запахом пыли и ржавчины. Стены украшены
      сложными механизмами ловушек.

      '
    examine: 'Механизмы ловушек кажутся древними, но все еще опасными. По углам виднеются
      останки предыдущих исследователей.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_003
      description: Выход в подземный коридор.
    - direction: north
      to_room: room_006
      description: Короткий проход к логову босса.
    - direction: west
      to_room: room_002
      flags:
      - HIDDEN
      description: Скрытая дверь ведет в башню стража.
  - id: room_005
    vnum: 20002
    name: Сокровищница
    description: 'Подземный зал, освещенный тусклыми факелами. Стены украшены драгоценностями
      и старинными монетами. Звук капающей воды и слабый запах сырости.

      '
    examine: 'В углу лежит старая шкатулка, возможно, здесь скрываются сокровища древнего
      князя.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: west
      to_room: room_003
      description: Выход в подземный коридор.
    - direction: north
      to_room: room_006
      description: Проход к логову босса.
  - id: room_006
    vnum: 20003
    name: Логово босса
    description: 'Темная пещера с высокими сводами. В центре огромный каменный трон,
      украшенный древними символами силы. Звук дыхания чудовища и слабый свет от волшебного
      амулета.

      '
    examine: 'На стенах видны следы битвы, возможно, здесь когда-то сражался Великий
      стражник Иван.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_004
      description: Выход в зал с ловушками.
    - direction: west
      to_room: room_005
      description: Проход из сокровищницы.
    - direction: up
      to_room: room_001
      flags:
      - CLOSED
      - QUEST_UNLOCK
      description: Закрытая лестница ведет наверх, но открывается после победы над
        боссом.
  - id: room_007
    vnum: 20013
    name: Вершина башни (секрет)
    description: 'Вы на вершине старинной башни, где враги не могут добраться. Вокруг
      видны трещины от прошлых боев.

      Слышно тихое гудение ветра и эхо шагов ниже. Пахнет древесиной и мхом. Камень
      под ногами холодный.

      '
    examine: 'Здесь можно найти старые доспехи и артефакты прошлых защитников. В центре
      башни - каменная плита с рунами.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: down
      to_room: room_002
      description: Лестница ведет вниз.
  - id: room_008
    vnum: 20014
    name: Подземный ход
    description: 'Вы находитесь в узком подземном коридоре, где стены покрыты плесенью
      и паутиной. Впереди видна лишь тьма.

      Слышится слабый шепот воды и капли с потолка. Пахнет сыростью и гнилью. Пол
      каменный, скользкий от влаги.

      '
    examine: 'На стенах можно заметить древние рисунки - знаки защитников города.
      Здесь когда-то проходили тайные встречи.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: south
      to_room: room_003
      description: Коридор ведет южнее.
    - direction: north
      to_room: room_009
      description: Путь продолжается на север.
  - id: room_009
    vnum: 20015
    name: Зал зеркал
    description: 'Вы в зале, где стены увешаны старыми зеркалами. В каждом отражении
      видны разные части коридора.

      Слышатся эхо шагов и тихий шепот. Пахнет пылью и мокрой кожей. Пол каменный,
      холодный на ощупь.

      '
    examine: 'Зеркала кажутся немного старомодными - они отражают не только вас, но
      и прошлое этого места.

      В углу заметно странное устройство с рунами - возможно, волшебная ловушка для
      нежити.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_008
      description: Коридор ведет южнее.
    - direction: north
      to_room: room_010
      description: Путь продолжается на север.
  - id: room_010
    vnum: 20010
    name: Подземная ловушка
    description: 'Темный подвал с каменными стенами и потолком. В воздухе висит запах
      сырости и ржавчины.

      Слышно тихое капание воды и скрип половиц, словно кто-то бродит поблизости.

      '
    examine: 'На полу валяются обломки старых ловушек. В углу можно заметить следы
      крови на камнях.

      Здесь когда-то проходили боевые действия с использованием подземных механизмов.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_009
      description: Небольшой проход ведет к следующей комнате.
    - direction: north
      to_room: room_006
      description: Путь к таинственной ловушке, за которой скрывается босс.
  - id: room_011
    vnum: 20011
    name: Подземный тоннель
    description: 'Темный коридор с узкими стенами и сводчатым потолком. Воздух холодный
      и сырой.

      Слышно, как где-то вдали стучат копьями и мечами.

      '
    examine: 'На стенах видны следы камней и стрел. Здесь когда-то проходили ожесточенные
      бои.

      В глубине тоннеля можно заметить слабое свечение, которое исходит от босса.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_005
      description: Тоннель ведет к следующей комнате.
    - direction: north
      to_room: room_006
      description: Путь к таинственной ловушке, за которой скрывается босс.
  - id: room_012
    vnum: 20012
    name: Подземный тайник
    description: 'Узкий коридор с каменными стенами и потолком. Воздух здесь холодный
      и сыроватый.

      Слышно, как где-то вдали стучат копьями и мечами.

      '
    examine: 'На стенах видны следы камней и стрел. Здесь когда-то проходили ожесточенные
      бои.

      В глубине тайника можно заметить слабое свечение, которое исходит от босса.

      '
    sector: UNDERGROUND
    flags:
