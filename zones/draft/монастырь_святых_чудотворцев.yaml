      Звуки: Скрип ржавых цепей и тихий стон старого дерева.

      Запахи: Кровь и затхлость запертыми комнатами.

      Текстуры: Камень холодный, цепи острые на ощупь.

      '
    examine: 'Под сковородой обнаруживаются старые бумаги с записями пыток. Цепи ведут
