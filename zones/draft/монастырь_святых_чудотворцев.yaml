zone:
  meta:
    id: zone_m_15-18
    name: Монастырь Святых Чудотворцев
    author: Zone Generator
    version: '1.0'
    description: Среди вековых сосен и унылой пустоши расположился заброшенный монастырь,
      который славится древними чудесами. Согласно местным преданиям, здесь обитают
      духи монахов-богословов, которые охраняют святые мощи и тайны божественного
      знания.
    recommended_level:
    - 15
    - 18
  lore:
    history: Монастырь Святых Чудотворцев был основан более тысячи лет назад на высоком
      берегу реки, где по легенде явился пророк и указал место для священного сооружения.
      В древние времена монастырь славился своим знанием тайных писаний и чудодейственными
      мощами усопших праведников. Однако с приходом темных времен, когда русские земли
      были объяты войной и разрухой, монастырь был оставлен последними братией старцев,
      которые поплатились жизнью за защиту святынь.
    folklore_basis: Согласно местным поверьям, духи монахов-богословов не покинули
      монастырь после смерти и теперь оберегают его от посягательств врагов. Считается,
      что те, кто приходит в это заброшенное место ночью, могут услышать их славословия
      и видеть свет свечей, мерцающих в главном соборе.
    current_state: Сейчас монастырь обитает духами и тенями прошлого. Его стены изъедены
      временем, а внутренние помещения заполнены древними писаниями и святынями, которые
      поджидают тех, кто сможет их отыскать среди руин.
    conflict: Основной конфликт связан с появлением сил тьмы, стремящихся захватить
      мощи монастыря для своих темных целей. Игрокам предстоит помочь духам защитить
      святыню и спасти чудодейственные реликвии.
    key_characters:
    - name: Брат Иоанн
      role: Последний настоятель монастыря, превратившийся в духа-защитника.
      description: Иоанн был священником и богословом, чьи знания о православии помогли
        ему оберегать святыни монастыря даже после смерти.
    - name: Святой Никита
      role: Усопший защитник мощей.
      description: Никита, убитый во время набега викингов, теперь охраняет монастырь
        от посягательств.
    atmosphere:
      sounds:
      - Шепот молитв
      - Вздыхание древних стен
      smells:
      - Запах старого дерева и свечного воска
      - Мятый лист лаванды
      visuals:
      - Призрачные фигуры в тусклом свете звезд
      - Старые книги, разбросанные среди руин
      feeling: Монастырь дышит древностью и сакральностью. Воздух наполнен сладковатым
        запахом благовоний и волокнами прошлого.
    secrets:
    - В монастырском саду растет трава, способная исцелять любую рану при определенной
      священной формуле.
    - Коренные узлы древней сосны в овраге хранят тайны первых богослужений.
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Темная арка ведет внутрь монастыря, освещенная лишь тусклым светом
      свечей. Стены изъедены временем и трещинами, сквозь которые проглядывает холод
      ночного воздуха.

      Шепот древних молитв и вздохи старых стен нарушают寂静的文本似乎被意外中断了，我将继续生成剩余部分，并确保符合您的要求。'
    exits:
    - direction: north
      to_room: room_002
    - direction: down
      to_room: room_003
    - direction: south
      to_room: world_forest_01
  - id: room_002
    vnum: 20001
    name: Зал с ловушками
    description: 'Зал глубоко под монастырём, где стены изъедены временем и тьмой.
      На полу видны следы битвы — ржавые осколки железа, разбросанные древние книги.
      Воздух наполнен металлическим запахом крови и старого дерева. Слышатся едва
      уловимые звуки щелчков ловушек.

      '
    examine: 'Узкие проходы между камнями ведут к тайным ловушкам, готовым сработать
      при малейшем движении. На стенах видны древние рисунки — символы защиты и предостережения.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - PEACEFUL
    exits:
    - direction: south
      to_room: room_001
    - direction: up
      to_room: room_007
    - direction: east
