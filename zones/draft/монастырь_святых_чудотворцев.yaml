  - id: room_003
    vnum: 20002
    name: Сокровищница
    description: 'Зал заполнен древними реликвиями и золотыми дарами. Стены украшены
      позолоченной мозаикой, на полу разбросаны старые книги и священные артефакты.
      Воздух наполнен сладковатым запахом благовоний. Звуки тихого шепота ветра и
      древних молитв.

      '
    examine: 'Узкие проходы между камнями ведут к тайным сокровищам, готовым защитить
      святыни от посягательств. На стенах видны древние рисунки — символы защиты и
