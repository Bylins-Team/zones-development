zone:
  meta:
    id: korovnik_zone
    name: Коровник Осириса
    author: Zone Generator
    version: '1.0'
    description: В этом заброшенном коровнике гуляют нечистые души и домовые. Здесь
      можно найти редкие травы для целителей, но также ожидать непредсказуемые чар.
    recommended_level:
    - 12
    - 16
  lore:
    history: Коровник Осириса, когда-то процветающий и полный жизни, был заброшен
      после трагической смерти его владельца. С тех пор здесь царит тишина, которую
      нарушают лишь шепот домовых и стонущие души умерших животных. Некоторые поверья
      говорят о том, что это место было однажды проклято боярыней Медведью за невинную
      смерть ее любимого коровника.
    folklore_basis: 'Основано на легендах о домовых и духах коровника, а также поверьях
      о проклятиях и нечисти. Источники: былинные песни и исторические своды славянской
      мифологии.'
    current_state: Сейчас в коровнике царит полумрак, прерываемый случайными разрывами
      света от могильников. Неизвестно, сколько душ здесь заключено, но они не позволяют
      никому войти с миром и уйти целым. Внезапно вспыхивающие огни издают странные
      звуки, вызывая тревогу.
    conflict: Игрокам необходимо исследовать коровник, чтобы найти редкие травы для
      центральной больницы в Новгороде. Однако они рискуют столкнуться с домовыми-хранителями
      и душами животных, которые не желают покидать свое последнее пристанище.
    key_characters:
    - name: Боярыня Медведь
      role: Создательница проклятия
      description: Злобная боярыня, убившая своего любимого коровника из страха перед
        невинной смертью.
    - name: Домовые-хранители
      role: Обереги коровника
      description: Разноцветные, но опасные домовые, защищающие свои владения от любых
        вторжений.
    atmosphere:
      sounds:
      - Стонущий ветер
      - Тихие шаги по скошенной траве
      smells:
      - Мокрая земля
      - Запах гниющих растительных остатков
      visuals:
      - Пламени из могильников
      - Распространенные теневые зоны
      feeling: Тихое, но напряженное ожидание чего-то неизвестного и опасного
    secrets:
    - Сокрытые сундуки с древними артефактами
    - Разноцветные огни от могильников содержат магическую энергию, которая может
      быть использована целителями.
  rooms:
  - id: room_001
    vnum: 20001
    name: Входная дверь
    description: 'Входная дверь коровника заперта на ржавые скобы. Окно слева пропущено,
      впусту оставляя лишь тусклый свет. Справа от входа виднеется узкий коридор,
      погруженный во мрак.

      '
    examine: 'На двери видны следы недавнего разлома. В углу лежит ржавый ключ вперемешку
      с засохшими травинками.

      '
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_002
      description: Узкий коридор, ведущий к дальней комнате.
  - id: room_002
    vnum: 20002
    name: Коридор
    description: 'Коридор узок и темен, лишь слабый свет приглушенно мерцает из-за
      могильников. Стены покрыты плесенью, а пол скрипит под ногами.

      '
    examine: 'Могильники вдоль коридора содержат магическую энергию. В одном углу
      виднеется сундук с древними артефактами.

      '
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_001
      description: Входная дверь коровника, заперта на ржавые скобы.
    - direction: south
      to_room: room_003
      description: Длинный коридор, ведущий дальше.
  - id: room_003
    vnum: 20003
    name: Коридор
    description: 'Длинный коридор простирается под землей, освещаемый мерцанием огней
      из могильников. Стены покрыты плесенью и тенями.

      '
    examine: 'В одном углу виднеется сундук с древними артефактами. Мерцающие огни
      от могильников содержат магическую энергию, которую можно использовать целителями.

      '
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
      description: Длинный коридор, освещаемый мерцанием огней.
  - id: room_004
    vnum: 20001
    name: Коридор
    description: 'Темный коридор, полный мрака и тени. Скошенная трава на полу под
      ногами мягко шуршит. Вдалеке слышится стонущий ветер, а рядом с могильниками
      периодически вспыхивают странные огни, издавая неприятные звуки. Запах гниющих
      растительных остатков и мокрой земли наполняет воздух.

      '
    examine: 'Стены коридора покрыты плесенью, а на полу видны следы прошлых вторжений.
      В углу сокрытый сундук с древними артефактами ждет своего часа. Эта часть коровника
      была проклята боярыней Медведью за невинную смерть ее любимого коровника.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_003
      description: Коридор продолжается в северном направлении.
  - id: room_005
    vnum: 20002
    name: Коридор
    description: 'Темный коридор, полный теней и опасности. Скошенная трава под ногами
