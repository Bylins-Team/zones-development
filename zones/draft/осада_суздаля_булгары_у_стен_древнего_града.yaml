zone:
  meta:
    id: zone_suzdal
    name: 'Осада Суздаля: Булгары у стен древнего града'
    author: Zone Generator
    version: '1.0'
    description: Великая осада на город-град Суздаль. Волжские булгары, привлеченны
      красотой местной девы, штурмуют город, защищенный храбрыми русичами.
    recommended_level:
    - 13
    - 18
  lore:
    history: Древний город Суздаль, построенный на высоком берегу реки Нерль, был
      известен своей неприступной крепостью и красотой местных дев. В старинных былинах
      говорится о том, что одна из таких красавиц, дочь великанши, привлекла внимание
      враждебного народа Булгаров, стремящихся захватить город ради ее руки и богатства
      Суздаля.
    folklore_basis: В былинах рассказывается о храбрых русичах, верных своему слову,
      которые отчаянно сражались против врагов на стенах города. Сказания повествуют
      также о том, как великанши и их дочери помогали защитникам Суздаля своими магическими
      силами.
    current_state: 'Сегодня укрепленные стены града наполнены боевыми приготовлениями:
      русичи готовятся к обороне, а булгарские воины собираются для штурма. В воздухе
      витает напряженность и ожидание близкой битвы.'
    conflict: Булгары осадили Суздаль из-за красоты местной девы, которая является
      дочерью великана. Русичи же готовятся отстоять свой город до последнего вздоха,
      верные своему слову и родному граду.
    key_characters:
    - name: Князь Владимир
      role: Главный защитник Суздаля
      description: Великий князь, храбрый воин и мудрый правитель, который несет ответственность
        за оборону города.
    - name: Русалка Нерльская
      role: Помощница защитников Суздаля
      description: Дочь великана, она живет в реке и помогает русичам своими магическими
        силами.
    - name: Хан Баир
      role: Лидер осаждающих булгаров
      description: Властный военачальник, чьи воины стремятся захватить Суздаль ради
        его богатств и славы.
    atmosphere:
      sounds:
      - Звуки суетливых приготовлений к обороне
      - Шепот предсказаний волхвов
      smells:
      - Пахнет дымом от разведчикских сигнальных костров
      - Воздух наполнен запахами русской печенки и свежего хлеба
      visuals:
      - Неприступные стены города с бойницами и турелями
      - Булгарские воины в ярких шлемах и доспехах, готовые к бою
      feeling: Воздух наполнен напряженностью и ожиданием, каждый шаг может стать
        решающим. Вокруг тишина, лишь иногда прерываемая звуками подготовки к битве.
    secrets:
    - Существует древнее заклятие, способное усилить защитников Суздаля
    - В подземельях города спрятана сокровищница древних русичей
  rooms:
  - id: room_001
    vnum: 20001
    name: Темный вход
    description: 'Темный коридор, ведущий внутрь города. Входы на север и под землю.

      Звуки шагов эхом отдаются в туннеле. Пахнет сыростью и древесиной.

      '
    examine: 'На стенах видны следы старых выжженных огнем рисунков, возможно,

      использовавшихся для защиты города.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: north
      to_room: room_002
      description: Дверь в башню стража.
    - direction: down
      to_room: room_003
      description: Лестница в подземный коридор.
    - direction: south
      to_room: world_forest_01
      description: Вход наружу, в лес.
  - id: room_002
    vnum: 20002
    name: Башня стража
    description: 'Высокая башня с видом на город и окрестности. Слышны голоса стражников.

      Пахнет свежим деревом от новых стрел.

      '
    examine: 'На стене висит старый меч, покрытый ржавчиной. Возможно,

      это оружие когда-то принадлежало храброму воину.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: south
      to_room: room_001
      description: Лестница вниз.
    - direction: up
      to_room: room_007
      description: Верхний уровень башни.
    - direction: east
      to_room: room_004
      flags:
      - HIDDEN
      description: Скрытая дверь на восток.
  - id: room_003
    vnum: 20003
    name: Подземный коридор
    description: 'Темный и узкий туннель с сырыми стенами. Звуки капающей воды.

      Пахнет плесенью и мокрой землей.

      '
    examine: 'В стене видны следы древних надписей, возможно,

      здесь когда-то проходили важные персоны города.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: up
      to_room: room_001
      description: Лестница вверх.
    - direction: north
      to_room: room_004
      description: Туннель на север, к боссу.
    - direction: east
      to_room: room_005
      description: Коридор на восток, к сокровищам.
  - id: room_004
    vnum: 20001
    name: Зал с ловушками
    description: 'Зал тесно заполнен камнями и гнилыми деревянными балками. В воздухе
      висит запах сырости и плесени, а стены покрыты мхом и лишайником. Периодически
      слышится скрип древних механизмов и шепот предупреждающих голосов.

      '
    examine: 'Стены украшены старыми рунами и символами, возможно, заклинаниями от
      ловушек. В углу виднеется раскрытая книга с изображениями древних богатырей
      и их битв.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_003
      description: Небольшой проход ведет к подземному коридору.
    - direction: north
      to_room: room_006
      description: Темный туннель с виднеющимся светом в конце, возможно, логово босса.
    - direction: west
      to_room: room_002
      flags:
      - HIDDEN
      description: Скрытый проход к башне стража, возможно, опасный или запертый.
  - id: room_005
    vnum: 20002
    name: Сокровищница
    description: 'Зал наполнен старыми доспехами и оружием, среди которых виднеются
      золотые монеты и драгоценные камни. Воздух здесь тяжелый от запаха древних металлов
      и кожи. Изредка доносится шорох крыс или эхо шагов в глубине.

      '
    examine: 'На стенах видны рисунки, изображающие богатырей и их подвиги. В углу
      лежит старый меч с вырезанными на ней символами могущественных богов.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: west
      to_room: room_003
      description: Узкий проход ведет к подземному коридору.
    - direction: north
      to_room: room_006
      description: Закрытая железная дверь, возможно, ведущая к логову босса.
  - id: room_006
    vnum: 20003
    name: Логово босса
    description: 'Зал наполнен тяжелой атмосферой, здесь чувствуется присутствие могущественного
      существа. Стены украшены кровавыми рунами и старыми осколками доспехов. Воздух
      холодный и влажный, пахнет гнилью и смертью.

      '
    examine: 'На полу лежит древний артефакт — камень с силой богатырей. Камень излучает
      слабое свечение, возможно, обладает магическими свойствами.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    - NO_MAGIC
    exits:
    - direction: south
      to_room: room_004
      description: Темный проход ведет к залу с ловушками.
    - direction: west
      to_room: room_005
      description: Закрытая железная дверь, возможно, ведущая из сокровищницы.
    - direction: up
      to_room: room_001
      flags:
      - CLOSED
      - QUEST_UNLOCK
      description: Короткий лестничный проход ведет наверх к темному входу.
  - id: room_007
    vnum: 20001
    name: Вершина башни (секрет)
    description: 'Вы на вершине высокой башни, где воздух свеж и прохладен. Вокруг
      виднеются стены города Суздаля с их бойницами и турелями. Вдалеке слышны звуки
      приготовления к обороне.

      Запахи дыма от сигнальных костров смешиваются с ароматом свежего хлеба, витающим
      из городских пекарен.

      '
    examine: 'На вершине башни вы замечаете древнее заклятие, о котором говорили местные
      предания. Оно усиливает защитников города и защищает его от внешних угроз.

      '
    sector: INSIDE
    flags:
    - INDOORS
    - DARKED
    exits:
    - direction: down
      to_room: room_002
      description: Лестница ведет вниз, к комнате стражи.
  - id: room_008
    vnum: 20002
    name: Пещера босса (север)
    description: 'Вы находитесь в темной пещере с высокими сводами. Стены покрыты
      мхом и лишайником, а воздух наполнен сыростью и запахом грибов.

      Из глубин пещеры доносятся тихие звуки - шорохи и дыхание.

      '
    examine: 'В центре пещеры виднеется вход в узкий коридор, который ведет к логову
      босса. Здесь можно заметить следы недавних боев.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: south
      to_room: room_006
      description: Узкий коридор ведет к логову босса.
  - id: room_009
    vnum: 20003
    name: Пещера босса (юг)
    description: 'Вы оказались в глубине пещеры, где воздух становится еще более сырым
      и холодным. Стены покрыты грибами и лишайником, а своды высоки и темны.

      Из глубины доносится легкий шум - дыхание или шаги.

      '
    examine: 'В центре пещеры виднеется вход в узкий коридор, который также ведет
      к логову босса. Здесь можно заметить следы недавних боев.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: north
      to_room: room_006
      description: Узкий коридор ведет к логову босса.
  - id: room_010
    vnum: 20010
    name: Подземный ход (запад)
    description: 'Темные каменные стены тесного подземного хода. Влажный воздух и
      холод проникают до костей.

      Стук сердца отражается эхом в узком проходе.

      '
    examine: "На стенах видны следы давних выбоин, возможно сделанные древними каменотёсами.\
      \ \nВдалеке слышится тихое журчание подземного ручья.\n"
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: east
      to_room: room_005
      description: Узкий проход ведёт на восток.
  - id: room_011
    vnum: 20011
    name: Подземный ход (восток)
    description: 'Низкие сводчатые потолки и каменные стены подземного хода. Звуки
      приготовлений к обороне доносятся издали.

      Воздух здесь влажен и холоден.

      '
    examine: "На стене заметны следы древних резьбы - возможно, символы силы или защитных\
      \ заклятий. \nВдалеке виднеется свет от костра разведчиков.\n"
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: west
      to_room: room_004
      description: Узкий проход ведёт на запад.
  - id: room_012
    vnum: 20012
    name: Подземный коридор (запад)
    description: 'Темные каменные стены и ровный пол подземного коридора. Воздух здесь
      прохладен и влажен.

      Издали слышатся тихие разговоры.

      '
    examine: "На стене виднеются следы древних посещений - выбоины от мечей и доспехов\
      \ русичей. \nВдалеке можно увидеть свет от костра в дальнем конце коридора.\n"
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: east
      to_room: room_003
      description: Узкий проход ведёт на восток.
  - id: room_013
    vnum: 20051
    name: Подземный коридор (восток)
    description: 'Коридор узкий и низкий, стены покрыты мхом и плесенью. Глухие каменные
      стены под ногами холодны и влажны.

      Звуки капающей воды эхом разносятся по коридору. Воздух наполнен запахом сырости
      и гнили.

      '
    examine: 'На стене виднеется древняя надпись, изъеденная мхом. Под ногами заметны
      следы от старых ловушек.

      Возможно, здесь когда-то проходили русичи в поисках сокровищ и безопасности.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: west
      to_room: room_004
      description: Узкий проход ведет на запад.
  - id: room_014
    vnum: 20052
    name: Подземный ход (север)
    description: 'Холодный и темный туннель с низким потолком. Стены покрыты трещинами,
      сквозь которые пробирается холод.

      Издали слышны приглушенные голоса и звуки подготовки к обороне. Воздух наполнен
      запахом плесени.

      '
    examine: 'На стене виднеются следы от древних ловушек, теперь уже бездействующих.
      Местами можно заметить старые надписи.

      Возможно, этот ход был использован русичами для скрытного передвижения во время
      осады.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: south
      to_room: room_005
      description: Туннель идет на юг.
  - id: room_015
    vnum: 20053
    name: Подземный ход (юг)
    description: 'Темный туннель с каменными стенами, покрытыми мхом и плесенью. Воздух
      холодный и сыроватый.

      Слышны приглушенные голоса и звуки подготовки к бою. Запах сырости и гнили висит
      в воздухе.

      '
    examine: 'На стенах виднеются следы от древних ловушек, теперь уже бездействующих.
      Местами можно заметить старые надписи.

      Возможно, этот ход был использован русичами для скрытного передвижения во время
      осады.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: north
      to_room: room_003
      description: Туннель идет на север.
  - id: room_016
    vnum: 20001
    name: Подземный коридор (север)
    description: 'Узкий туннель с мокрыми каменными стенами. Пахнет сыростью и грибами.

      Звуки капающей воды и слабый свет от факела в конце коридора.

      '
    examine: 'На стенах видны следы древних рисунков и надписей. Возможно, это часть

      секретного хода к сокровищнице.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: south
      to_room: room_004
      description: Выход в зал с ловушками.
  - id: room_017
    vnum: 20002
    name: Подземный коридор (юг)
    description: 'Темный и узкий туннель, освещенный слабым светом от факела. Пахнет
      плесенью.

      Слышны звуки капающей воды и ветра снаружи.

      '
    examine: 'На стенах видны следы древних ловушек и трещины, из которых вытекает
      вода.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: north
      to_room: room_003
      description: Выход к подземному коридору.
  - id: room_018
    vnum: 20003
    name: Подземный ход (запад)
    description: 'Узкий проход с мокрыми каменными стенами. Пахнет сыростью и плесенью.

      Слышны звуки капающей воды и ветра.

      '
    examine: 'На стенах видны следы древних надписей и рисунков, указывающих на секретные

      пути города.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: east
      to_room: room_005
      description: Выход к сокровищнице.
  - id: room_019
    vnum: 20019
    name: Подземный ход (восток)
    description: 'Узкий туннель с мшистыми стенами и сырым воздухом. Свет от факелов
      слабо освещает путь.

      '
    examine: 'На стенах видны следы древних рисунков и надписей, а также затекшие
      свечные воски.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: west
      to_room: room_004
      description: Узкий проход ведет на запад.
  - id: room_020
    vnum: 20020
    name: Подземный коридор (запад)
    description: 'Темный коридор с каменными стенами и мокрыми от подземных источников.
      Звуки капающей воды.

      '
    examine: 'На стенах заметны следы древних ловушек, а в глубине туннеля слышно
      шепот предсказаний волхвов.

      '
    sector: UNDERGROUND
    flags:
    - INDOORS
    - DARKED
    - TUNNEL
    exits:
    - direction: east
      to_room: room_003
      description: Узкий проход ведет на восток.
  mobiles:
  - id: mob_001
    vnum: 20101
    name:
      nominative: Булгарский разведчик
      genitive: Булгарского разведчика
      dative: Булгарскому разведчику
      accusative: Булгарского разведчика
      instrumental: Булгарским разведчиком
      prepositional: Булгарском разведчике
    level: 13
    role: TRASH
    race: HUMAN
    description: 'Молодой воин в ярком шлеме и легкой броне.

      '
    examine: 'На его поясе висит амулет с символом Булгарского хана Баира.

      '
    action: 'Разведчик внимательно осматривает окрестности, готовый к бою.

      '
    stats:
      hp: 260
      damage_dice: 6d8+9
      armor_class: 30
      hitroll: 7
    abilities:
    - kick
    flags:
    - AGGRESSIVE
    - SENTINEL
    resistances:
      fire: 0
